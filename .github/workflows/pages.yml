# Builds the game and publishes it to GitHub Pages so it can be played on a
# phone without a LAN server. `vite.config.ts` sets `base: './'`, so the
# bundle works from the /<repo>/ subpath Pages serves a project site from.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 to match local, and because `npm run budget` runs a .ts file
          # directly — Node only strips types natively from 22.6 onward, and
          # on 20 it fails with ERR_UNKNOWN_FILE_EXTENSION.
          node-version: '24'
          cache: npm
      - run: npm ci
      # Same gates that run locally — a red build should never reach Pages.
      - run: npx tsc --noEmit
      - run: npx eslint src --max-warnings 0
      - run: npm run test -- --run
      - run: npm run build
      # Asserts dist/ is under Poki's 8 MB initial-download cap (§3 rule 2).
      - run: npm run budget
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
