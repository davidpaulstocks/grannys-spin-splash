<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Granny's Spin Splash</title>
    <!-- Poki SDK v2 — the only allowed external request (CLAUDE.md §3 SDK integration) -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <style>
      /* Fredoka, bundled locally — Google Fonts is blocked by Poki (CLAUDE.md §5.2). Variable font: one file, all weights. */
      @font-face {
        font-family: 'Fredoka';
        src: url('/fonts/fredoka.woff2') format('woff2');
        font-weight: 400 700;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1f2138;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
      }

      /*
        Portrait gate. The game is locked 16:9 (CLAUDE.md §3 rule 1), so a
        portrait phone letterboxes it to a ~375x211 band adrift in the middle
        of a black screen — every touch target drops under 34 CSS px and the
        HUD text under 10. The reference prototype had a rotate gate; the
        rebuild dropped it (found by spec audit, 2026-09-12). Pure CSS so it
        works before any JS runs and cannot itself fail.
        Palette: Ink / Cloud / Sunny Gold from §5.1. The phone glyph is drawn
        with borders rather than an emoji (§7.3 rule 8).
      */
      #rotate-gate {
        display: none;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #game {
          display: none;
        }
        #rotate-gate {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 24px;
          width: 100vw;
          height: 100vh;
          color: #f5f2e8;
          font-family: 'Fredoka', system-ui, sans-serif;
          text-align: center;
          padding: 0 32px;
          box-sizing: border-box;
        }
        #rotate-gate .phone {
          width: 64px;
          height: 104px;
          border: 6px solid #f5f2e8;
          border-radius: 16px;
          animation: rotate-hint 2s ease-in-out infinite;
        }
        #rotate-gate p {
          margin: 0;
          font-size: 22px;
          font-weight: 600;
          line-height: 1.4;
        }
        #rotate-gate .sub {
          font-size: 16px;
          font-weight: 400;
          color: #ffc93c;
        }
        @keyframes rotate-hint {
          0%,
          45% {
            transform: rotate(0deg);
          }
          70%,
          100% {
            transform: rotate(-90deg);
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-gate">
      <div class="phone"></div>
      <p>Turn your phone sideways to play!</p>
      <p class="sub">Granny needs the whole wall in view</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
