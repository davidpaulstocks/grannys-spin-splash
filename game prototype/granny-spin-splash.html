<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Granny's Spin Splash 💦</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#06021A;
    display:flex;justify-content:center;align-items:center;
    min-height:100vh;min-height:100dvh;overflow:hidden;
    user-select:none;-webkit-user-select:none;
    touch-action:none;-webkit-tap-highlight-color:transparent;
  }
  canvas{display:block;cursor:none;touch-action:none;}

  /* Portrait lock overlay */
  #rotate-wrap{
    display:none;position:fixed;inset:0;z-index:9999;
    background:#06021A;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;text-align:center;padding:32px;
  }
  #rotate-wrap .ri{font-size:72px;animation:rtilt 1.6s ease-in-out infinite alternate;}
  #rotate-wrap h2{color:#FFD700;font-size:22px;font-family:'Arial Black',Arial,sans-serif;line-height:1.3;}
  #rotate-wrap p{color:#88AACC;font-size:14px;font-family:Arial,sans-serif;}
  @keyframes rtilt{from{transform:rotate(0deg)}to{transform:rotate(90deg)}}
  @media(orientation:portrait){
    #rotate-wrap{display:flex;}
    canvas,#game-container{display:none;}
  }
</style>
</head>
<body>
<div id="rotate-wrap">
  <div class="ri">📱</div>
  <h2>Rotate your device!</h2>
  <p>Granny's Spin Splash plays in landscape mode 💦</p>
</div>
<div id="game-container">
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
<script>
const W=960, H=540;

// ═══════════════════════════════════════════
//  AUDIO
// ═══════════════════════════════════════════
class AudioManager {
  constructor(){ this.ctx=null;this.master=null;this.muted=false;this.streamSrc=null;this.streamGain=null;this.streaming=false;this.p2StreamSrc=null;this.p2StreamGain=null;this.p2Streaming=false; }
  init(){ if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=0.65;this.master.connect(this.ctx.destination);}catch(e){} }
  get ok(){ return !!this.ctx&&!this.muted; }
  resume(){ if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); }
  toggleMute(){ this.muted=!this.muted;if(this.master)this.master.gain.value=this.muted?0:0.65;return this.muted; }
  _noise(dur,hi=1100){ const sr=this.ctx.sampleRate,len=Math.ceil(sr*dur),buf=this.ctx.createBuffer(1,len,sr),d=buf.getChannelData(0);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;b0=.99886*b0+w*.0555;b1=.99332*b1+w*.0751;b2=.969*b2+w*.1539;b3=.8665*b3+w*.3105;b4=.55*b4+w*.5330;b5=-.7616*b5-w*.0169;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.116;}const src=this.ctx.createBufferSource();src.buffer=buf;const f=this.ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hi;f.Q.value=0.7;src.connect(f);return{src,out:f}; }
  _osc(type,f0,t,dur,vol,f1=null){ const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur*0.8);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.02); }
  _startStream(vol=0.15){ const{src,out}=this._noise(0.5,1000);src.loop=true;const sg=this.ctx.createGain();sg.gain.setValueAtTime(0,this.ctx.currentTime);sg.gain.linearRampToValueAtTime(vol,this.ctx.currentTime+0.05);out.connect(sg);sg.connect(this.master);src.start();return{src,gain:sg}; }
  startStream(){ if(!this.ok||this.streaming)return;this.resume();const{src,gain}=this._startStream(0.15);this.streamSrc=src;this.streamGain=gain;this.streaming=true; }
  stopStream(){ if(!this.streaming||!this.streamGain)return;const t=this.ctx.currentTime;this.streamGain.gain.setValueAtTime(this.streamGain.gain.value,t);this.streamGain.gain.linearRampToValueAtTime(0,t+0.08);const s=this.streamSrc;setTimeout(()=>{try{s.stop();}catch(_){}},120);this.streamSrc=null;this.streamGain=null;this.streaming=false; }
  startStreamP2(){ if(!this.ok||this.p2Streaming)return;this.resume();const{src,gain}=this._startStream(0.12);this.p2StreamSrc=src;this.p2StreamGain=gain;this.p2Streaming=true; }
  stopStreamP2(){ if(!this.p2Streaming||!this.p2StreamGain)return;const t=this.ctx.currentTime;this.p2StreamGain.gain.setValueAtTime(this.p2StreamGain.gain.value,t);this.p2StreamGain.gain.linearRampToValueAtTime(0,t+0.08);const s=this.p2StreamSrc;setTimeout(()=>{try{s.stop();}catch(_){}},120);this.p2StreamSrc=null;this.p2StreamGain=null;this.p2Streaming=false; }
  playHit(spd=50,hi=false){ if(!this.ok)return;this.resume();const t=this.ctx.currentTime,f=hi?(80+spd*3)*1.3:60+spd*3.5;this._osc('sawtooth',f,t,0.18,0.12,f*2.2); }
  playCombo(lvl){ if(!this.ok)return;this.resume();const fs=[0,262,330,392,523,660],f=fs[Math.min(lvl,5)];if(!f)return;this._osc('triangle',f,this.ctx.currentTime,0.28,0.16,f*1.4); }
  playUpgrade(st){ if(!this.ok)return;this.resume();const roots=[0,330,523,784],r=roots[st]||440;[1,1.26,1.5,2].slice(0,st+1).forEach((m,i)=>this._osc('sine',r*m,this.ctx.currentTime+i*0.075,0.45,0.17)); }
  playPump(){ if(!this.ok)return;this.resume();const t=this.ctx.currentTime;[0,0.14].forEach(d=>this._osc('square',180,t+d,0.11,0.22,55)); }
  playRefill(){ if(!this.ok)return;this.resume();const t=this.ctx.currentTime;[523,659,784,1047].forEach((f,i)=>this._osc('sine',f,t+i*0.09,0.35,0.14)); }
  playPickup(){ if(!this.ok)return;this.resume();this._osc('sine',440,this.ctx.currentTime,0.3,0.18,880); }
  playTick(u){ if(!this.ok)return;this.resume();this._osc('sine',u?880:660,this.ctx.currentTime,u?0.12:0.07,0.1); }
  playGameOver(){ if(!this.ok)return;this.resume();const t=this.ctx.currentTime;[392,330,262,196].forEach((f,i)=>this._osc('sawtooth',f,t+i*0.22,0.3,0.18,f*0.85)); }
  playDeflect(){ if(!this.ok)return;this.resume();this._osc('sine',300,this.ctx.currentTime,0.15,0.1,180); }
  playShoo(){ if(!this.ok)return;this.resume();const t=this.ctx.currentTime;this._osc('square',600,t,0.08,0.15,900);this._osc('square',500,t+0.1,0.12,0.1,300); }
  playGoldenAppear(){ if(!this.ok)return;this.resume();const t=this.ctx.currentTime;[880,1047,1319].forEach((f,i)=>this._osc('sine',f,t+i*0.06,0.2,0.15)); }
  playGoldenExpire(){ if(!this.ok)return;this.resume();this._osc('sine',440,this.ctx.currentTime,0.5,0.12,220); }
  playFrenzy(){ if(!this.ok)return;this.resume();const t=this.ctx.currentTime;[523,659,784,1047,1319,1047,784,1047,1319,1568].forEach((f,i)=>this._osc(i%2===0?'sine':'triangle',f,t+i*0.11,0.1,0.2)); }
  playPowerup(type){ if(!this.ok)return;this.resume();const t=this.ctx.currentTime;if(type==='SOAKER')[440,550,660,880].forEach((f,i)=>this._osc('sine',f,t+i*0.06,0.18,0.15));else if(type==='TURBO')[200,300,500].forEach((f,i)=>this._osc('square',f,t+i*0.04,0.12,0.18));else if(type==='SPINLOCK')[660,784,880].forEach((f,i)=>this._osc('triangle',f,t+i*0.07,0.2,0.14));else if(type==='GOLDEN_SPLASH')[523,784,1047,1319].forEach((f,i)=>this._osc('sine',f,t+i*0.06,0.22,0.18));else[392,523,659,784].forEach((f,i)=>this._osc('sine',f,t+i*0.06,0.18,0.14)); }
}

const S = { STOPPED:0, SLOW:1, MEDIUM:2, FULL:3 };

const PU = {
  SOAKER:       { col:0x4488FF, label:'💦', name:'SUPER SOAKER',  dur:6  },
  TURBO:        { col:0xFF4422, label:'⚡', name:'TURBO PUMP',    dur:0  },

  DOUBLE_STARS: { col:0xAA44FF, label:'×2', name:'DOUBLE STARS',  dur:10 },
};

const WORLDS = {
  GARDEN:   { name:'Garden',   emoji:'🌻', time:30, desc:'12 spinners · Classic',           bg:'fence',   grid:{cols:4,rows:3,mx:135,my:52,sy:132}, types:['PINWHEEL','FAN','WINDMILL'],          obs:[] },
  WORKSHOP: { name:'Workshop', emoji:'🔧', time:30, desc:'15 spinners · Obstacles',          bg:'pegboard',grid:{cols:5,rows:3,mx:105,my:52,sy:132}, types:['COG','PROPELLER','WHIRLIGIG','DISCO','FAN','WINDMILL'],obs:['CAT','UMBRELLA','UMBRELLA','DUCK'] },
  FUNFAIR:  { name:'Funfair',  emoji:'🎪', time:30, desc:'16 spinners · Moving targets',     bg:'funfair', grid:{cols:4,rows:4,mx:130,my:45,sy:112}, types:['PROPELLER','PINWHEEL','FAN','WINDMILL'],obs:['UMBRELLA','UMBRELLA'], movingTargets:true },
  KITCHEN:  { name:'Kitchen',  emoji:'🍳', time:30, desc:'16 spinners · Double cats',        bg:'kitchen', grid:{cols:4,rows:4,mx:130,my:45,sy:112}, types:['WHIRLIGIG','COG','WINDMILL','FAN'],   obs:['CAT','CAT','UMBRELLA'] },
  DISCO:    { name:'Disco',    emoji:'🪩', time:30, desc:'20 spinners · Golden fever',       bg:'disco',   grid:{cols:5,rows:4,mx:105,my:42,sy:108}, types:['DISCO','PINWHEEL','PROPELLER','WHIRLIGIG','FAN'],obs:['UMBRELLA','DUCK'], goldenFrequent:true },
};

// ═══════════════════════════════════════════
//  WORLD SELECT  — logo + layout
// ═══════════════════════════════════════════
class WorldSelectScene extends Phaser.Scene {
  constructor(){ super('WorldSelectScene'); }

  create(){
    this.playerMode=1;
    this.spinnerAngle=0;

    // ── Deep space background ──
    const bg=this.add.graphics();
    bg.fillGradientStyle(0x06021A,0x06021A,0x010810,0x010810,1);
    bg.fillRect(0,0,W,H);
    // Stars
    for(let i=0;i<110;i++){const x=Math.random()*W,y=Math.random()*H,r=Math.random()*1.4+0.3;this.add.circle(x,y,r,0xFFFFFF,Math.random()*0.6+0.2);}

    // ── Starburst behind logo ──
    const burst=this.add.graphics().setDepth(0);
    const bcx=W/2-30, bcy=108;
    for(let i=0;i<16;i++){
      const a=(i/16)*Math.PI*2, a2=a+Math.PI/16;
      burst.fillStyle(i%2===0?0xFFDD00:0xFF8800, 0.07);
      burst.beginPath();burst.moveTo(bcx,bcy);
      burst.lineTo(bcx+Math.cos(a)*310,bcy+Math.sin(a)*190);
      burst.lineTo(bcx+Math.cos(a2)*310,bcy+Math.sin(a2)*190);
      burst.closePath();burst.fillPath();
    }

    // ── LOGO: Granny blasting spinner ──
    this._drawLogo();
    this._addFloatingWords();
    this._startLogoAnimations();

    // ── Animated spinner (replaces boring demo) ──
    this.spinGfx=this.add.graphics().setDepth(5);
    this.time.addEvent({delay:16,loop:true,callback:()=>{
      this.spinnerAngle+=0.055;
      this._drawAnimSpinner();
    }});

    // ── Granny Gold Vault display ──
    const vault=loadVault();
    const vaultLevel=getLevel(vault);
    const vg=this.add.graphics().setDepth(8);
    vg.fillStyle(0x1A1200,0.92);vg.fillRoundedRect(W-210,8,202,52,10);
    vg.lineStyle(2,vault>0?0xFFCC00:0x445566,0.8);vg.strokeRoundedRect(W-210,8,202,52,10);
    this.add.text(W-108,16,'🏦 GRANNY GOLD VAULT',{fontSize:'11px',fill:'#AAAAAA',fontFamily:'Arial,sans-serif'}).setOrigin(0.5,0).setDepth(9);
    const vaultNumStyle={fontSize:'22px',fill:vault>=550?'#FFD700':vault>0?'#FFCC44':'#556677',stroke:'#000',strokeThickness:3,fontFamily:'Arial Black,Arial'};
    this.add.text(W-130,31,`${vault.toLocaleString()} ⭐`,vaultNumStyle).setOrigin(0,0).setDepth(9);
    if(vault>0){
      this.add.text(W-108,50,`${vaultLevel.emoji} ${vaultLevel.label}`,{fontSize:'11px',fill:vaultLevel.colHex,fontFamily:'Arial Black,Arial'}).setOrigin(0.5,0).setDepth(9);
    } else {
      this.add.text(W-108,50,'Play to fill the vault!',{fontSize:'11px',fill:'#445566',fontFamily:'Arial,sans-serif'}).setOrigin(0.5,0).setDepth(9);
    }

    // ── Ambient water jets ──
    this.ambientJets=[
      {x:55,  y:H*0.64, angle:-0.88, col:0x44AAFF, altCol:0x88CCFF, rate:0.07, t:0, particles:[]},
      {x:W-65,y:H*0.64, angle:-2.26, col:0x55DDBB, altCol:0xAAEEDD, rate:0.07, t:0, particles:[]},
      {x:W/2+160,y:H*0.66, angle:-1.55, col:0x66AAFF, altCol:0x99CCFF, rate:0.09, t:0.5, particles:[]},
    ];
    this.ambientSplash=[];
    this.ambientGfx=this.add.graphics().setDepth(2).setAlpha(0.75);
    this.time.addEvent({delay:16,loop:true,callback:()=>this._updateAmbientWater()});

    // ── 1P / 2P toggle — centred below logo ──
    const ty=230;
    const toggleBg=this.add.graphics().setDepth(10);
    const drawToggle=()=>{
      toggleBg.clear();
      const active1=this.playerMode===1, active2=this.playerMode===2;
      toggleBg.fillStyle(active1?0x1155CC:0x0A1A33,0.95);toggleBg.fillRoundedRect(W/2-145,ty,130,36,9);
      toggleBg.lineStyle(active1?3:1.5,active1?0x88BBFF:0x223355,1);toggleBg.strokeRoundedRect(W/2-145,ty,130,36,9);
      toggleBg.fillStyle(active2?0xAA4400:0x331500,0.95);toggleBg.fillRoundedRect(W/2+15,ty,130,36,9);
      toggleBg.lineStyle(active2?3:1.5,active2?0xFF9944:0x442200,1);toggleBg.strokeRoundedRect(W/2+15,ty,130,36,9);
    };
    drawToggle();
    const t1p=this.add.text(W/2-80,ty+18,'👵  1 PLAYER',{fontSize:'14px',fill:'#FFF',fontFamily:'Arial Black,Arial'}).setOrigin(0.5).setDepth(11).setInteractive({useHandCursor:true});
    const t2p=this.add.text(W/2+80,ty+18,'👴👵  2 PLAYERS',{fontSize:'14px',fill:'#FFF',fontFamily:'Arial Black,Arial'}).setOrigin(0.5).setDepth(11).setInteractive({useHandCursor:true});
    t1p.on('pointerdown',()=>{this.playerMode=1;drawToggle();});
    t2p.on('pointerdown',()=>{this.playerMode=2;drawToggle();});

    // ── "Choose your world" ──
    this.add.text(W/2,278,'— Choose Your World —',{fontSize:'14px',fill:'#5577AA',fontFamily:'Arial,sans-serif'}).setOrigin(0.5).setDepth(10);

    // ── World cards: row of 5 evenly spaced ──
    const keys=Object.keys(WORLDS);
    const cardW=166, cardH=108, rowY1=350, rowY2=462;
    // Row 1: 3 cards centred
    const r1xs=[W/2-cardW-12, W/2, W/2+cardW+12];
    keys.slice(0,3).forEach((k,i)=>this._card(r1xs[i],rowY1,k,cardW,cardH));
    // Row 2: 2 cards centred
    const r2xs=[W/2-(cardW/2+8), W/2+(cardW/2+8)];
    keys.slice(3,5).forEach((k,i)=>this._card(r2xs[i],rowY2,k,cardW,cardH));

    this.input.setDefaultCursor('auto');
  }

  // ─────────────────────────────────────────
  //  LOGO  — Ghibli Granny + blast at camera
  // ─────────────────────────────────────────
  _drawLogo(){
    const g=this.add.graphics().setDepth(3);
    const gx=210, gy=142;

    // Radial speed lines (comic action)
    g.lineStyle(2,0xFFDD00,0.15);
    for(let i=0;i<22;i++){
      const a=Math.PI+((i-11)/11)*0.7;
      g.lineBetween(gx+Math.cos(a)*18,gy+Math.sin(a)*14,gx+Math.cos(a)*210,gy+Math.sin(a)*155);
    }
    // Inner glow ring
    g.lineStyle(3,0xFFCC00,0.12);g.strokeCircle(gx,gy,105);
    g.lineStyle(2,0xFF8844,0.08);g.strokeCircle(gx,gy,140);

    const s=(v)=>v*1.48;

    // ── Shadow ──
    g.fillStyle(0x000000,0.22);g.fillEllipse(gx+4,gy+s(64),s(78),s(18));

    // ── Legs & shoes ──
    g.fillStyle(0x223366);g.fillRect(gx+s(-15),gy+s(32),s(13),s(30));g.fillRect(gx+s(3),gy+s(28),s(13),s(26));
    g.fillStyle(0x111111);g.fillEllipse(gx+s(-11),gy+s(63),s(28),s(13));g.fillEllipse(gx+s(10),gy+s(60),s(30),s(14));

    // ── Dress — billowing, Ghibli soft folds ──
    g.fillStyle(0x9933CC);g.fillEllipse(gx+s(4),gy+s(12),s(60),s(72));
    // Fold highlights
    g.fillStyle(0xBB55EE,0.35);g.fillEllipse(gx+s(-8),gy+s(0),s(22),s(50));
    g.fillStyle(0x7711AA,0.3);g.fillEllipse(gx+s(20),gy+s(8),s(16),s(44));
    // Flowers on dress — dainty Ghibli detail
    const fc=[0xFF99CC,0xFFDD55,0xFF7799,0xBBFF88,0xFFAAFF];
    for(let i=0;i<12;i++){const fx=gx+Phaser.Math.Between(-22,26),fy=gy+Phaser.Math.Between(-12,38);g.fillStyle(fc[i%5],0.9);g.fillCircle(fx,fy,s(4));g.fillStyle(0xFFFFFF,0.4);g.fillCircle(fx,fy,s(2));}
    // Apron / front panel
    g.fillStyle(0xFFEECC,0.25);g.fillEllipse(gx+s(2),gy+s(14),s(28),s(52));

    // ── Body / shoulders ──
    g.fillStyle(0xFFCC99);g.fillEllipse(gx+s(2),gy+s(-20),s(38),s(34));
    // Shawl / collar
    g.fillStyle(0x7711AA,0.5);g.fillEllipse(gx+s(2),gy+s(-28),s(44),s(18));

    // ── Left arm at side ──
    g.fillStyle(0xFFCC99);g.fillEllipse(gx+s(-24),gy+s(-6),s(14),s(38));g.fillEllipse(gx+s(-26),gy+s(12),s(12),s(18));

    // ── RIGHT ARM — extended forward gripping gun ──
    g.fillStyle(0xFFCC99);g.fillEllipse(gx+s(22),gy+s(-14),s(14),s(36));g.fillEllipse(gx+s(38),gy+s(-28),s(12),s(26));g.fillEllipse(gx+s(50),gy+s(-38),s(12),s(18));

    // ── Head — Ghibli: round, soft, expressive ──
    // Base head shape — rounder + slightly larger
    g.fillStyle(0xFFCC99);g.fillCircle(gx+s(2),gy+s(-52),s(27));
    // Subtle cheek warmth
    g.fillStyle(0xFF9966,0.22);g.fillCircle(gx+s(-16),gy+s(-43),s(12));g.fillCircle(gx+s(20),gy+s(-43),s(12));
    // Chin softening
    g.fillStyle(0xFFCC99);g.fillEllipse(gx+s(2),gy+s(-32),s(30),s(18));

    // ── WILD GHIBLI HAIR ──
    // Back layer (slightly darker)
    g.fillStyle(0xDDDDDD);
    g.fillCircle(gx+s(-22),gy+s(-68),s(18));g.fillCircle(gx+s(0),gy+s(-76),s(20));g.fillCircle(gx+s(22),gy+s(-68),s(17));
    // Wild side sprays
    g.fillCircle(gx+s(-38),gy+s(-60),s(14));g.fillCircle(gx+s(-52),gy+s(-50),s(10));g.fillCircle(gx+s(-62),gy+s(-38),s(7));
    g.fillCircle(gx+s(36),gy+s(-62),s(12));g.fillCircle(gx+s(50),gy+s(-52),s(9));

    g.fillCircle(gx+s(-10),gy+s(-88),s(10));g.fillCircle(gx+s(6),gy+s(-92),s(12));g.fillCircle(gx+s(20),gy+s(-86),s(9));
    // Front bright layer
    g.fillStyle(0xF8F8F8);
    g.fillCircle(gx+s(-14),gy+s(-64),s(16));g.fillCircle(gx+s(2),gy+s(-70),s(18));g.fillCircle(gx+s(18),gy+s(-64),s(15));
    g.fillCircle(gx+s(-8),gy+s(-58),s(11));g.fillCircle(gx+s(12),gy+s(-58),s(10));
    // Shimmery top puff
    g.fillStyle(0xFFFFFF);g.fillCircle(gx+s(4),gy+s(-74),s(12));
    // Tiny hair pin — Ghibli loves these
    g.fillStyle(0xFF55AA);g.fillCircle(gx+s(14),gy+s(-76),s(5));g.lineStyle(s(2),0xFF88CC,0.9);g.lineBetween(gx+s(9),gy+s(-76),gx+s(19),gy+s(-76));
    // Eyebrows — one arched high in GLEE
    g.lineStyle(s(3.5),0x888855,1);
    g.beginPath();g.arc(gx+s(-9),gy+s(-62),s(8),3.7,5.7);g.strokePath();  // normal
    g.beginPath();g.arc(gx+s(13),gy+s(-67),s(9),3.3,5.3);g.strokePath();  // raised dramatically

    // ── GHIBLI EYES — large, luminous, full of soul ──
    // Eye whites
    g.fillStyle(0xFFFFFF);g.fillEllipse(gx+s(-9),gy+s(-52),s(17),s(14));g.fillEllipse(gx+s(13),gy+s(-52),s(17),s(14));
    // Irises — warm blue-grey
    g.fillStyle(0x5588BB);g.fillCircle(gx+s(-9),gy+s(-52),s(6));g.fillCircle(gx+s(13),gy+s(-52),s(6));
    g.fillStyle(0x3366AA);g.fillCircle(gx+s(-9),gy+s(-52),s(4.5));g.fillCircle(gx+s(13),gy+s(-52),s(4.5));
    // Pupils — off-centre (looking forward toward screen with wild joy)
    g.fillStyle(0x111122);g.fillCircle(gx+s(-7),gy+s(-53),s(3));g.fillCircle(gx+s(15),gy+s(-53),s(3));
    // Primary glint star (top-left of each eye — Ghibli signature)
    g.fillStyle(0xFFFFFF);g.fillCircle(gx+s(-12),gy+s(-55),s(2.2));g.fillCircle(gx+s(10),gy+s(-55),s(2.2));
    // Secondary tiny glint
    g.fillStyle(0xEEEEFF,0.7);g.fillCircle(gx+s(-7),gy+s(-49),s(1.2));g.fillCircle(gx+s(15),gy+s(-49),s(1.2));
    // Lower eyelid line (Ghibli softness)
    g.lineStyle(s(1.5),0xFFAA88,0.4);g.beginPath();g.arc(gx+s(-9),gy+s(-50),s(7),0.2,Math.PI-0.2);g.strokePath();
    g.beginPath();g.arc(gx+s(13),gy+s(-50),s(7),0.2,Math.PI-0.2);g.strokePath();

    // ── EXPRESSION: open-mouth laugh of pure joy ──
    // Open mouth shape
    g.fillStyle(0xCC3344);g.fillEllipse(gx+s(2),gy+s(-37),s(22),s(15));
    // Teeth (top row)
    g.fillStyle(0xFFFFFF);g.fillRect(gx+s(-9),gy+s(-43),s(22),s(8));
    // Tongue (cute pink)
    g.fillStyle(0xFF7799);g.fillEllipse(gx+s(2),gy+s(-35),s(14),s(8));
    // Mouth outline
    g.lineStyle(s(2),0xAA2233,1);g.beginPath();g.arc(gx+s(2),gy+s(-40),s(13),0.1,Math.PI-0.1);g.strokePath();
    // Laugh lines — Ghibli characters earn these
    g.lineStyle(s(2),0xFFAAAA,0.5);
    g.beginPath();g.arc(gx+s(-18),gy+s(-36),s(7),0.3,1.5);g.strokePath();
    g.beginPath();g.arc(gx+s(22),gy+s(-36),s(7),Math.PI-1.5,Math.PI-0.3);g.strokePath();
    // Rosy cheeks — signature Ghibli
    g.fillStyle(0xFF8899,0.45);g.fillCircle(gx+s(-19),gy+s(-40),s(10));g.fillCircle(gx+s(23),gy+s(-40),s(10));

    // Ears
    g.fillStyle(0xFFCC99);g.fillEllipse(gx+s(-28),gy+s(-50),s(10),s(16));g.fillEllipse(gx+s(32),gy+s(-50),s(10),s(16));
    g.fillStyle(0xFFAA88,0.4);g.fillEllipse(gx+s(-28),gy+s(-50),s(6),s(10));

    // ── MEGA WATER CANNON — front-facing, blasting at viewer ──
    // Granny is holding it aimed roughly toward us — foreshortened barrel
    const cx=gx+s(62), cy=gy+s(-35); // barrel center point (nozzle, pointing at viewer)

    // Tank body (large impressive backpack-style)
    g.fillStyle(0x1144CC);g.fillRoundedRect(gx+s(28),gy+s(-52),s(42),s(28),s(8));
    g.fillStyle(0x3366EE,0.5);g.fillRoundedRect(gx+s(30),gy+s(-50),s(38),s(10),s(6));
    g.fillStyle(0x0D2E99);g.fillRoundedRect(gx+s(30),gy+s(-30),s(38),s(8),s(4));
    // Pressure indicator
    g.fillStyle(0xFF3322);g.fillCircle(gx+s(60),gy+s(-44),s(7));g.fillStyle(0xFF6655);g.fillCircle(gx+s(60),gy+s(-44),s(5));
    g.fillStyle(0x000000);g.fillRect(gx+s(59),gy+s(-48),s(2),s(8)); // needle pointing UP (max pressure!)
    // Pipes/hoses connecting tank to barrel
    g.lineStyle(s(7),0x0D2E99,1);g.lineBetween(gx+s(42),gy+s(-26),cx,cy+s(12));
    g.lineStyle(s(5),0x2255BB,1);g.lineBetween(gx+s(44),gy+s(-26),cx,cy+s(12));

    // Barrel — foreshortened (circular opening facing viewer)
    // Outer barrel ring
    g.fillStyle(0x0D2E99);g.fillEllipse(cx,cy,s(40),s(32));
    g.fillStyle(0x1144CC);g.fillEllipse(cx,cy,s(32),s(26));
    g.fillStyle(0x2255DD);g.fillEllipse(cx,cy,s(22),s(18));
    // Inner barrel darkness (depth effect)
    g.fillStyle(0x000022);g.fillEllipse(cx,cy,s(14),s(11));
    // Barrel rim highlight
    g.lineStyle(s(3),0x88AAFF,0.8);g.strokeEllipse(cx,cy,s(40),s(32));
    g.lineStyle(s(1.5),0x4488FF,0.5);g.strokeEllipse(cx,cy,s(30),s(24));
    // Nozzle bolts
    for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;g.fillStyle(0x4466AA);g.fillCircle(cx+Math.cos(a)*s(17),cy+Math.sin(a)*s(14),s(2.5));}
    // Water glow inside barrel
    g.fillStyle(0x44AAFF,0.6);g.fillEllipse(cx,cy,s(10),s(8));
    g.fillStyle(0x88DDFF,0.8);g.fillEllipse(cx,cy,s(6),s(5));
    // Store nozzle pos for animations
    this._nozzleX=cx; this._nozzleY=cy;

    // Pump handle
    g.fillStyle(0xFF4422);g.fillRoundedRect(gx+s(26),gy+s(-64),s(14),s(18),s(5));g.fillStyle(0xFF7755,0.5);g.fillRoundedRect(gx+s(28),gy+s(-63),s(10),s(7),s(4));

    // ── WATER STREAM  arc to live spinner ──
    const wg=this.add.graphics().setDepth(4);
    this._streamGfx=wg;
    // Initial static draw; animation will override
    for(let i=0;i<=20;i++){const t=i/20,wx=cx+s(20+t*280),wy=cy-Math.sin(t*Math.PI)*40,sz=(1-t)*9+t*5;wg.fillStyle(0x44AAFF,0.8-t*0.25);wg.fillCircle(wx,wy,sz);wg.fillStyle(0x88DDFF,0.45);wg.fillCircle(wx-1,wy-1,sz*0.45);}

    // ── TITLE TEXT ──
    const t1=this.add.text(W/2+65,24,"GRANNY'S",{fontSize:'44px',fill:'#FF4466',stroke:'#000',strokeThickness:8,fontFamily:'Arial Black,Arial'}).setOrigin(0.5).setDepth(6);
    const t2=this.add.text(W/2+65,72,'SPIN SPLASH',{fontSize:'60px',fill:'#FFD700',stroke:'#000',strokeThickness:10,fontFamily:'Arial Black,Arial'}).setOrigin(0.5).setDepth(6);
    this.add.text(W/2+65,126,'💦',{fontSize:'28px'}).setOrigin(0.5).setDepth(6);

    // Subtle title pulse (Ghibli-style breathing animation)
    this.tweens.add({targets:t2,scaleX:{from:1,to:1.04},scaleY:{from:1,to:1.04},duration:1800,yoyo:true,repeat:-1,ease:'Sine.InOut'});
    this.tweens.add({targets:t1,scaleX:{from:1,to:1.03},scaleY:{from:1,to:1.03},duration:2200,yoyo:true,repeat:-1,ease:'Sine.InOut',delay:400});
  }

  // ─────────────────────────────────────────

  _addFloatingWords(){

      {text:'SPLASH!',    col:'#44CCFF', stroke:'#003366', sz:26, x:700, y:48,  angle:10},
      {text:'SOAKED! 💧', col:'#FF88FF', stroke:'#440044', sz:18, x:820, y:155, angle:-8},
      {text:'HAHAHA!!',   col:'#FFCC44', stroke:'#664400', sz:20, x:38,  y:218, angle:14},
      {text:'OOH!',       col:'#88FFCC', stroke:'#004433', sz:24, x:880, y:218, angle:-16},
      {text:'💦💦',       col:'#88DDFF', stroke:'#002244', sz:28, x:55,  y:140, angle:0},
      {text:'✨ SPIN ✨', col:'#FFEEAA', stroke:'#665500', sz:16, x:760, y:310, angle:8},
      {text:'POW!',       col:'#FF6644', stroke:'#440000', sz:22, x:148, y:55,  angle:-18},
    ];

    words.forEach((w,i)=>{
      const txt=this.add.text(w.x,w.y,w.text,{
        fontSize:`${w.sz}px`,fill:w.col,stroke:w.stroke,strokeThickness:4,
        fontFamily:'Arial Black,Arial'
      }).setAngle(w.angle).setDepth(7);

      // Float up-down
      this.tweens.add({targets:txt,y:w.y-12-Math.random()*14,duration:1800+i*280,yoyo:true,repeat:-1,ease:'Sine.InOut',delay:i*180});
      // Gentle wobble
      this.tweens.add({targets:txt,angle:w.angle+(Math.random()>0.5?6:-6),duration:2400+i*320,yoyo:true,repeat:-1,ease:'Sine.InOut',delay:i*220});
      // Scale breathe
      this.tweens.add({targets:txt,scaleX:1.12,scaleY:1.12,duration:1600+i*200,yoyo:true,repeat:-1,ease:'Sine.InOut',delay:i*140});
    });
  }

  // ─────────────────────────────────────────
  //  Logo animations: barrel blast + stream
  // ─────────────────────────────────────────
  _startLogoAnimations(){
    // Blast particles radiating from barrel (firing at camera)
    this.blastParticles=[];
    this.blastGfx=this.add.graphics().setDepth(8);

    // Stream pulse particles
    this.streamParticles=[];
    this.streamGfx=this.add.graphics().setDepth(4);

    // Water droplets on "screen" (hit camera effect)
    this.droplets=[];
    for(let i=0;i<8;i++){
      const d={x:Phaser.Math.Between(W*0.35,W*0.75),y:Phaser.Math.Between(10,200),sz:Phaser.Math.Between(4,12),alpha:Math.random()*0.4+0.15,vy:Phaser.Math.Between(20,60)};
      this.droplets.push(d);
    }
    this.dropletGfx=this.add.graphics().setDepth(9);

    // Target spinner position
    const spX=690, spY=110;

    this.time.addEvent({delay:16,loop:true,callback:()=>{
      const dt=0.016, now=this.time.now;
      const nx=this._nozzleX||270, ny=this._nozzleY||110;

      // ── Blast particles (radiating from nozzle toward camera) ──
      // Spawn 3 per frame in a cone pointing forward-left
      for(let i=0;i<3;i++){
        const spread=(Math.random()-0.5)*0.7;
        const baseAngle=Math.PI+0.2; // pointing left-ish (toward viewer)
        const spd=90+Math.random()*80;
        this.blastParticles.push({
          x:nx, y:ny,
          vx:Math.cos(baseAngle+spread)*spd - Math.random()*30,
          vy:Math.sin(baseAngle+spread)*spd - Math.random()*20,
          life:0.6+Math.random()*0.5, maxLife:1.1,
          sz:3+Math.random()*7,
          col:Math.random()>0.3?0x44AAFF:Math.random()>0.5?0x88DDFF:0xCCEEFF
        });
      }

      this.blastGfx.clear();
      for(const p of this.blastParticles){
        p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=60*dt; p.life-=dt;
        if(p.life<=0) continue;
        const a=Math.min(1,p.life/p.maxLife*1.6)*0.8;
        const sz=p.sz*(0.3+0.7*(p.life/p.maxLife));
        this.blastGfx.fillStyle(p.col,a);this.blastGfx.fillCircle(p.x,p.y,sz);
        this.blastGfx.fillStyle(0xCCEEFF,a*0.4);this.blastGfx.fillCircle(p.x-sz*0.3,p.y-sz*0.3,sz*0.4);
      }
      this.blastParticles=this.blastParticles.filter(p=>p.life>0&&this.blastParticles.length<120);

      // ── Stream to spinner (animated flowing dots) ──
      const phase=now*0.003;
      this.streamGfx.clear();
      for(let i=0;i<=28;i++){
        const t=((i/28)+phase)%1;
        const wx=nx+(spX-nx)*t, wy=ny+(spY-ny)*t - Math.sin(t*Math.PI)*38;
        const sz=(1-t)*9+t*4.5, al=(0.5+0.5*Math.sin(t*Math.PI))*0.85;
        this.streamGfx.fillStyle(0x44AAFF,al);this.streamGfx.fillCircle(wx,wy,sz);
        this.streamGfx.fillStyle(0x88DDFF,al*0.5);this.streamGfx.fillCircle(wx-1,wy-1,sz*0.45);
      }
      // Splash at spinner impact
      for(let i=0;i<10;i++){
        const a=(i/10)*Math.PI*2+phase*2, sp=18+Math.sin(phase*3+i)*8;
        this.streamGfx.fillStyle(0x44AAFF,0.5+Math.sin(phase*4+i)*0.2);
        this.streamGfx.fillCircle(spX+Math.cos(a)*sp,spY+Math.sin(a)*sp,2.5+Math.sin(phase*5+i)*1.5);
      }

      // ── Barrel glow pulse ──
      this.blastGfx.fillStyle(0x44AAFF,0.15+Math.sin(phase*8)*0.1);
      this.blastGfx.fillEllipse(nx,ny,44,36);
      this.blastGfx.fillStyle(0x88DDFF,0.2+Math.sin(phase*8)*0.08);
      this.blastGfx.fillEllipse(nx,ny,22,18);

      // ── Droplets on "camera lens" ──
      this.dropletGfx.clear();
      for(const d of this.droplets){
        d.y+=d.vy*dt; if(d.y>H*0.45+d.sz){d.y=Phaser.Math.Between(-20,0);d.x=Phaser.Math.Between(W*0.3,W*0.75);}
        this.dropletGfx.fillStyle(0x88CCFF,d.alpha);this.dropletGfx.fillEllipse(d.x,d.y,d.sz*0.7,d.sz);
        this.dropletGfx.fillStyle(0xCCEEFF,d.alpha*0.5);this.dropletGfx.fillEllipse(d.x-d.sz*0.15,d.y-d.sz*0.2,d.sz*0.25,d.sz*0.35);
        // Streak below
        this.dropletGfx.lineStyle(1,0x88CCFF,d.alpha*0.3);this.dropletGfx.lineBetween(d.x,d.y+d.sz,d.x+1,d.y+d.sz+d.vy*0.15);
      }
    }});
  }

  // Ambient animated water squirts on homepage
  _updateAmbientWater(){
    const dt=0.016, g=this.ambientGfx; g.clear();
    // Spawn particles from each jet
    for(const jet of this.ambientJets){
      jet.t-=dt;
      if(jet.t<=0){
        jet.t=jet.rate;
        for(let i=0;i<4;i++){
          const spread=(Math.random()-0.5)*0.18;
          const spd=160+Math.random()*70;
          jet.particles.push({
            x:jet.x, y:jet.y,
            vx:Math.cos(jet.angle+spread)*spd,
            vy:Math.sin(jet.angle+spread)*spd,
            life:1.4+Math.random()*0.5, maxLife:1.9,
            sz:2.5+Math.random()*3.5,
            col:Math.random()>0.4?jet.col:jet.altCol
          });
        }
      }
      // Update + draw particles
      for(const p of jet.particles){
        p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=140*dt; p.life-=dt;
        if(p.life<=0) continue;
        const a=Math.min(1,p.life/p.maxLife*1.5)*0.65;
        const sz=p.sz*(0.4+0.6*(p.life/p.maxLife));
        g.fillStyle(p.col,a); g.fillCircle(p.x,p.y,sz);
        g.fillStyle(0xCCEEFF,a*0.4); g.fillCircle(p.x-1,p.y-1,sz*0.45);
        // Spawn splash when particle hits ground area
        if(p.vy>0 && p.y>H*0.61 && p.y<H*0.68 && Math.random()<0.08){
          for(let s=0;s<4;s++){
            const sa=(Math.random()-0.5)*Math.PI;
            this.ambientSplash.push({x:p.x,y:p.y,vx:Math.cos(sa)*30,vy:-40-Math.random()*40,life:0.35,sz:2+Math.random()*2.5,col:p.col});
          }
          p.life=-1;
        }
      }
      jet.particles=jet.particles.filter(p=>p.life>0);
    }
    // Update + draw splash particles
    for(const s of this.ambientSplash){
      s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=200*dt; s.life-=dt;
      if(s.life<=0) continue;
      const a=(s.life/0.35)*0.5;
      g.fillStyle(s.col,a); g.fillCircle(s.x,s.y,s.sz*a+0.5);
    }
    this.ambientSplash=this.ambientSplash.filter(s=>s.life>0);
    if(this.ambientSplash.length>80) this.ambientSplash.length=80;
  }

  // Animated spinner (right side of logo, spins live)
  _drawAnimSpinner(){
    const g=this.spinGfx; g.clear();
    const sx=685, sy=105, r=42;
    const cols=[0xFF4455,0x4499FF,0x44DD66,0xFFCC00];
    // Motion blur rings
    g.lineStyle(2,0xFFFFFF,0.06);g.strokeCircle(sx,sy,r+8);g.strokeCircle(sx,sy,r+14);
    // Blades
    for(let b=0;b<4;b++){
      const a=(b/4)*Math.PI*2+this.spinnerAngle;
      const sw=Math.PI*0.44;
      g.fillStyle(cols[b],1);g.beginPath();g.moveTo(sx,sy);
      for(let t=0;t<=1.01;t+=0.1){const ang=a+t*sw,d=r*(0.18+t*0.82);g.lineTo(sx+Math.cos(ang)*d,sy+Math.sin(ang)*d);}
      g.lineTo(sx+Math.cos(a+sw*0.5)*r*0.22,sy+Math.sin(a+sw*0.5)*r*0.22);
      g.closePath();g.fillPath();
    }
    // Gold glow (it's going FAST)
    g.fillStyle(0xFFDD00,0.18);g.fillCircle(sx,sy,r+14);
    g.fillStyle(0xFFDD00,0.10);g.fillCircle(sx,sy,r+22);
    // Center pin
    g.fillStyle(0xCCCCCC);g.fillCircle(sx,sy,8);g.fillStyle(0x888888);g.fillCircle(sx,sy,5);
    // Speed lines around spinner
    g.lineStyle(1.5,0xFFFFFF,0.25);
    for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2+this.spinnerAngle*0.3,r1=r+18,r2=r1+16;g.lineBetween(sx+Math.cos(a)*r1,sy+Math.sin(a)*r1,sx+Math.cos(a)*r2,sy+Math.sin(a)*r2);}
  }

  // ─────────────────────────────────────────
  //  World cards  — tidy aligned
  // ─────────────────────────────────────────
  _card(x,y,key,cw,ch){
    const w=WORLDS[key];
    const c=this.add.container(x,y).setDepth(10);
    const p=this.add.graphics();
    const draw=(h)=>{p.clear();p.fillStyle(h?0x1a3a6a:0x0d1f3a,0.96);p.fillRoundedRect(-cw/2,-ch/2,cw,ch,12);p.lineStyle(h?3:1.5,h?0x88BBFF:0x223355,h?0.9:0.5);p.strokeRoundedRect(-cw/2,-ch/2,cw,ch,12);};
    draw(false);c.add(p);
    const hit=this.add.rectangle(0,0,cw,ch,0,0).setInteractive({useHandCursor:true});c.add(hit);
    c.add(this.add.text(0,-30,w.emoji,{fontSize:'28px'}).setOrigin(0.5));
    c.add(this.add.text(0,-2,w.name,{fontSize:'15px',fill:'#FFD700',stroke:'#000',strokeThickness:3,fontFamily:'Arial Black,Arial'}).setOrigin(0.5));
    c.add(this.add.text(0,20,w.desc,{fontSize:'10px',fill:'#99BBDD',fontFamily:'Arial,sans-serif',align:'center',wordWrap:{width:cw-16}}).setOrigin(0.5));
    c.add(this.add.text(0,38,`⏱ ${w.time}s`,{fontSize:'11px',fill:'#556677',fontFamily:'Arial,sans-serif'}).setOrigin(0.5));
    hit.on('pointerover',()=>{draw(true);this.tweens.add({targets:c,scaleX:1.06,scaleY:1.06,duration:100,ease:'Quad.Out'});});
    hit.on('pointerout', ()=>{draw(false);this.tweens.add({targets:c,scaleX:1,scaleY:1,duration:100});});
    hit.on('pointerdown',()=>this.scene.start('GameScene',{world:key,mode:this.playerMode}));
  }
}

// ═══════════════════════════════════════════
//  GRANNY LEVELS  (score thresholds)
// ═══════════════════════════════════════════
const GRANNY_LEVELS = [
  { min:0,    label:'Soggy Granny',     emoji:'💧', col:0x6699BB, colHex:'#6699BB', desc:'A valiant first splash!',              badge:0x4477AA },
  { min:100,  label:'Garden Granny',    emoji:'🌻', col:0x66AA44, colHex:'#88CC55', desc:'You\'re getting the hang of it!',       badge:0x448833 },
  { min:250,  label:'Splash Rookie',    emoji:'💦', col:0x4488CC, colHex:'#55AADD', desc:'Nice and steady soaking!',              badge:0x2266AA },
  { min:480,  label:'Wave Rider',       emoji:'🌊', col:0x2255BB, colHex:'#4488FF', desc:'Riding the spray beautifully!',         badge:0x1144AA },
  { min:800,  label:'Power Sprayer',    emoji:'⚡', col:0xCCAA22, colHex:'#FFCC33', desc:'Electrifying aim and power!',           badge:0xAA8811 },
  { min:1200, label:'Spin Queen',       emoji:'👑', col:0xAA6622, colHex:'#FFAA44', desc:'You rule the spinning wall!',           badge:0x885511 },
  { min:1700, label:'Legendary Granny', emoji:'🏆', col:0xCC4400, colHex:'#FF6622', desc:'A true splash LEGEND!',                 badge:0xAA3300 },
  { min:2400, label:'GOLDEN GRANNY',    emoji:'✨', col:0xFFCC00, colHex:'#FFD700', desc:'THE ULTIMATE WATER WARRIOR!!',          badge:0xCC9900, golden:true },
];

function getLevel(score){ return [...GRANNY_LEVELS].reverse().find(l=>score>=l.min)||GRANNY_LEVELS[0]; }

// ── Persistent Granny Gold Vault ──
function loadVault(){ try{ return parseInt(localStorage.getItem('grannyGoldVault')||'0'); }catch(e){ return 0; } }
function saveVault(add){ try{ const t=loadVault()+add; localStorage.setItem('grannyGoldVault',t); return t; }catch(e){ return add; } }
function resetVault(){ try{ localStorage.removeItem('grannyGoldVault'); }catch(e){} }

// ═══════════════════════════════════════════
//  GAME OVER  — massive celebration screen
// ═══════════════════════════════════════════
class GameOverScene extends Phaser.Scene {
  constructor(){ super('GameOverScene'); }
  init(d){ this.finalScore=d.score||0;this.audio=d.audio;this.worldKey=d.world||'GARDEN';this.mode=d.mode||1; }

  create(){
    this.confetti=[];
    this.confettiGfx=this.add.graphics().setDepth(10);
    const level=getLevel(this.finalScore);
    const isGolden=level.golden||false;

    // Save to vault immediately
    this.vaultTotal = saveVault(this.finalScore);
    const vaultLevel = getLevel(this.vaultTotal);

    // ── Dark cinematic backdrop ──
    const bg=this.add.rectangle(W/2,H/2,W,H,0x000000,0.95);
    if(isGolden){
      // Golden bg shimmer
      const shine=this.add.graphics();shine.fillGradientStyle(0x1A1000,0x1A1000,0x000000,0x000000,1);shine.fillRect(0,0,W,H);
    }

    // ── Burst of confetti ──
    this.time.delayedCall(100,()=>this._burstConfetti(isGolden,level.col));

    // ── World badge top left ──
    const w=WORLDS[this.worldKey];
    this.add.text(20,16,`${w.emoji} ${w.name}`,{fontSize:'15px',fill:'#888',fontFamily:'Arial,sans-serif'}).setDepth(20);

    // ── Score counter ──
    this.add.text(W/2,62,'YOUR SCORE',{fontSize:'18px',fill:'#AAAAAA',stroke:'#000',strokeThickness:3,fontFamily:'Arial Black,Arial'}).setOrigin(0.5).setDepth(20);
    const scoreTxt=this.add.text(W/2,120,'0',{fontSize:'88px',fill:'#FFD700',stroke:'#000',strokeThickness:8,fontFamily:'Arial Black,Arial'}).setOrigin(0.5).setDepth(20);

    // Dramatic score count-up
    let shown=0; const tgt=this.finalScore;
    this.time.addEvent({delay:18,repeat:Math.min(tgt,80),callback:()=>{
      const step=Math.max(1,Math.ceil((tgt-shown)/20));
      shown=Math.min(tgt,shown+step);
      scoreTxt.setText(shown);
      if(shown>=tgt){
        this.tweens.add({targets:scoreTxt,scaleX:1.3,scaleY:1.3,duration:120,yoyo:true,ease:'Back.Out'});
        this.audio?.resume();
      }
    }});

    // ── Granny Gold Vault running total (fades in after score) ──
    this.time.delayedCall(1000,()=>{
      const vg=this.add.graphics().setDepth(20).setAlpha(0);
      vg.fillStyle(0x1A1200,0.92);vg.fillRoundedRect(W/2-160,150,320,38,10);
      vg.lineStyle(2,this.vaultTotal>0?0xFFCC00:0x445566,0.7);vg.strokeRoundedRect(W/2-160,150,320,38,10);
      const vtxt=this.add.text(W/2,169,`🏦 Vault Total: ${this.vaultTotal.toLocaleString()} ⭐   ${vaultLevel.emoji} ${vaultLevel.label}`,{
        fontSize:'14px',fill:'#FFCC44',stroke:'#000',strokeThickness:2,fontFamily:'Arial Black,Arial'
      }).setOrigin(0.5).setDepth(21).setAlpha(0);
      this.tweens.add({targets:[vg,vtxt],alpha:1,y:{from:160,to:169},duration:500,ease:'Back.Out'});
      vtxt.y=169; // reset after tween target
    });

    // ── Level badge — slides in after score + vault ──
    this.time.delayedCall(1900,()=>{
      this._showLevel(level,isGolden);
    });

    // ── Next level teaser ──
    this.time.delayedCall(2800,()=>{
      this._showNextLevel(level);
    });

    // ── Buttons — appear last ──
    this.time.delayedCall(3400,()=>{
      this._showButtons();
    });

    if(this.audio) this.audio.playGameOver();
    this.input.setDefaultCursor('auto');

    // Ongoing confetti update
    this.events.on('update',()=>this._updateConfetti());
  }

  _burstConfetti(isGolden,levelCol){
    const cols=isGolden
      ?[0xFFDD00,0xFFAA00,0xFFEE66,0xFFFFAA,0xFFBB00,0xFFFFFF]
      :[0xFF4455,0x4499FF,0x44DD66,0xFFCC00,0xFF88FF,0x44FFEE,0xFF8844,0xFFFFFF];
    for(let i=0;i<90;i++){
      this.confetti.push({
        x:Phaser.Math.Between(W*0.1,W*0.9), y:Phaser.Math.Between(-80,-10),
        vx:(Math.random()-0.5)*180, vy:Phaser.Math.Between(60,200),
        rot:Math.random()*360, rotSpd:(Math.random()-0.5)*360,
        w:Phaser.Math.Between(6,14), h:Phaser.Math.Between(4,8),
        col:cols[Math.floor(Math.random()*cols.length)],
        alpha:1, dead:false
      });
    }
    // Second burst a bit later
    this.time.delayedCall(400,()=>{
      for(let i=0;i<60;i++){
        this.confetti.push({
          x:Phaser.Math.Between(0,W), y:Phaser.Math.Between(-60,0),
          vx:(Math.random()-0.5)*220, vy:Phaser.Math.Between(40,160),
          rot:Math.random()*360, rotSpd:(Math.random()-0.5)*480,
          w:Phaser.Math.Between(5,10), h:Phaser.Math.Between(3,6),
          col:cols[Math.floor(Math.random()*cols.length)],
          alpha:1, dead:false
        });
      }
    });
  }

  _updateConfetti(){
    const g=this.confettiGfx; if(!g) return; g.clear();
    const dt=1/60;
    for(const c of this.confetti){
      if(c.dead) continue;
      c.x+=c.vx*dt; c.y+=c.vy*dt; c.vy+=180*dt;
      c.rot+=c.rotSpd*dt; c.vx*=0.995;
      if(c.y>H+20) c.dead=true;
      const rad=c.rot*Math.PI/180, cos=Math.cos(rad), sin=Math.sin(rad);
      const hw=c.w/2, hh=c.h/2;
      g.fillStyle(c.col,c.alpha);
      g.beginPath();
      g.moveTo(c.x+cos*(-hw)-sin*(-hh), c.y+sin*(-hw)+cos*(-hh));
      g.lineTo(c.x+cos*hw-sin*(-hh),    c.y+sin*hw+cos*(-hh));
      g.lineTo(c.x+cos*hw-sin*hh,       c.y+sin*hw+cos*hh);
      g.lineTo(c.x+cos*(-hw)-sin*hh,    c.y+sin*(-hw)+cos*hh);
      g.closePath(); g.fillPath();
    }
  }

  _showLevel(level,isGolden){
    // Badge circle
    const bx=W/2, by=270;
    const badgeGfx=this.add.graphics().setDepth(20).setAlpha(0);
    if(isGolden){
      // Pulsing golden rings
      badgeGfx.fillStyle(0xFFDD00,0.15); badgeGfx.fillCircle(bx,by,85);
      badgeGfx.fillStyle(0xFFCC00,0.25); badgeGfx.fillCircle(bx,by,68);
    }
    badgeGfx.fillStyle(level.badge,1); badgeGfx.fillCircle(bx,by,52);
    badgeGfx.lineStyle(4,isGolden?0xFFDD00:0xFFFFFF,0.8); badgeGfx.strokeCircle(bx,by,52);
    if(isGolden){ badgeGfx.lineStyle(2,0xFFFF88,0.5); badgeGfx.strokeCircle(bx,by,60); }

    const emojiTxt=this.add.text(bx,by,level.emoji,{fontSize:'52px'}).setOrigin(0.5).setDepth(21).setAlpha(0).setScale(0.3);
    const levelTxt=this.add.text(bx,by+76,level.label,{
      fontSize:isGolden?'38px':'32px', fill:level.colHex,
      stroke:'#000', strokeThickness:7, fontFamily:'Arial Black,Arial'
    }).setOrigin(0.5).setDepth(21).setAlpha(0);
    const descTxt=this.add.text(bx,by+116,level.desc,{
      fontSize:'16px', fill:'#CCDDFF', fontFamily:'Arial,sans-serif'
    }).setOrigin(0.5).setDepth(21).setAlpha(0);

    // Score bracket line
    const scoreLine=this.add.text(bx,by+145,`${level.min}+ ⭐ required`,{
      fontSize:'13px', fill:'#888888', fontFamily:'Arial,sans-serif'
    }).setOrigin(0.5).setDepth(21).setAlpha(0);

    // Animate everything in
    this.tweens.add({targets:badgeGfx,alpha:1,scaleX:{from:0.2,to:1},scaleY:{from:0.2,to:1},duration:500,ease:'Back.Out'});
    this.tweens.add({targets:emojiTxt,alpha:1,scaleX:1,scaleY:1,duration:400,delay:200,ease:'Back.Out'});
    this.tweens.add({targets:levelTxt,alpha:1,y:{from:by+90,to:by+76},duration:350,delay:350,ease:'Quad.Out'});
    this.tweens.add({targets:descTxt,alpha:1,duration:300,delay:500,ease:'Quad.Out'});
    this.tweens.add({targets:scoreLine,alpha:1,duration:300,delay:600,ease:'Quad.Out'});

    // Golden sparkle aura
    if(isGolden){
      this.tweens.add({targets:emojiTxt,
        scaleX:{from:1,to:1.15},scaleY:{from:1,to:1.15},
        duration:700,yoyo:true,repeat:-1,ease:'Sine.InOut',delay:600});
      // Shine flash
      this.time.delayedCall(300,()=>{
        const shine=this.add.rectangle(W/2,H/2,W,H,0xFFFF88,0).setDepth(30);
        this.tweens.add({targets:shine,alpha:{from:0.5,to:0},duration:600,onComplete:()=>shine.destroy()});
      });
    }
  }

  _showNextLevel(currentLevel){
    const idx=GRANNY_LEVELS.indexOf(currentLevel);
    const next=GRANNY_LEVELS[idx+1];
    if(!next) return; // already max level
    const needed=next.min-this.finalScore;
    const txt=this.add.text(W/2,172,`${needed} more ⭐ to reach ${next.emoji} ${next.label}`,{
      fontSize:'14px', fill:'#888888', fontFamily:'Arial,sans-serif'
    }).setOrigin(0.5).setDepth(20).setAlpha(0);
    this.tweens.add({targets:txt,alpha:1,duration:400,ease:'Quad.Out'});
  }

  _showButtons(){
    const btn1=this._btn(W/2-120,H-64,'▶  PLAY AGAIN',()=>this.scene.start('GameScene',{world:this.worldKey,mode:this.mode}));
    const btn2=this._btn(W/2+120,H-64,'🌍  WORLDS',()=>this.scene.start('WorldSelectScene'));
    [btn1,btn2].forEach(b=>{b.setAlpha(0);this.tweens.add({targets:b,alpha:1,y:{from:H-40,to:H-64},duration:350,ease:'Back.Out'});});
  }

  _btn(x,y,lbl,cb){
    const b=this.add.text(x,y,lbl,{fontSize:'22px',fill:'#FFF',stroke:'#003399',strokeThickness:5,backgroundColor:'#1155CC',padding:{x:18,y:10},fontFamily:'Arial Black,Arial'}).setOrigin(0.5).setDepth(20).setInteractive({useHandCursor:true});
    b.on('pointerover',()=>b.setStyle({fill:'#FFD700'}));b.on('pointerout',()=>b.setStyle({fill:'#FFF'}));b.on('pointerdown',cb);
    return b;
  }
}

// ═══════════════════════════════════════════
//  GAME SCENE
// ═══════════════════════════════════════════
class GameScene extends Phaser.Scene {
  constructor(){ super('GameScene'); }
  init(data){ this.worldKey=data?.world||'GARDEN';this.wc=WORLDS[this.worldKey];this.mode=data?.mode||1; }

  create(){
    // ── Shared state ──
    this.score=0;this._lastScore=0;
    this.combo=0;this.comboTimer=0;this.lastHitSpinner=null;
    this.splashFrenzy=false;this.frenzyTimer=0;
    this.gameTime=this.wc.time;this.gameOver=false;this.lastTickSecond=this.wc.time;
    this.waterParticles=[];this.splashParticles=[];this.starParticles=[];
    this.floatingTexts=[];this.waterPickups=[];
    this.obstacles=[];this.goldenSpinner=null;this.discoFlareTimer=0;
    this.powerups=[];this.fx={soaker:0,spinlock:0,doubleStars:0,goldenSplash:false};

    // ── P1 (Granny) state ──
    this.grannyX=this.mode===2?3*W/4:W/2;
    this.grannySpeed=320;this.grannyBob=0;this._facingWall=false;
    this.aimX=W/2;this.aimY=H/3;this.aimSnapped=false;this.aimTarget=null;
    this.gunX=this.grannyX-88;this.gunY=H*0.66-20;
    this.gunNozzleOffsetX=-88;this.gunNozzleOffsetY=-12;
    this.waterTank=100;this.isPumping=false;this.pumpTimer=0;
    this._fireToggle=false;this._wasStreaming=false;this._nextSpawn=0;

    // ── P2 (Granddad) state — only used in 2P ──
    this.granddadX=W/4;this.granddadSpeed=300;this.granddadBob=0;this._p2FacingWall=false;
    this.p2AimX=W/4;this.p2AimY=H/3;this.p2AimSpeed=240;
    this.p2GunX=W/4;this.p2GunY=H*0.66-20;
    this.p2NozzleOffsetX=88;this.p2NozzleOffsetY=-12;
    this.p2WaterTank=100;this.p2IsPumping=false;this.p2PumpTimer=0;
    this.p2FireToggle=false;this.p2WasStreaming=false;this.p2NextSpawn=0;

    this.audio=new AudioManager();
    this.buildBg();this.buildGranny();
    if(this.mode===2)this.buildGranddad();
    this.buildSpinners();this.buildObstacles();this.buildHUD();this.setupInput();

    this.ringGfx      =this.add.graphics().setDepth(12);
    this.waterGfx     =this.add.graphics().setDepth(30);
    this.splashGfx    =this.add.graphics().setDepth(35);
    this.pickupGfx    =this.add.graphics().setDepth(22);
    this.powerupGfx   =this.add.graphics().setDepth(24);
    this.starGfx      =this.add.graphics().setDepth(40);
    this.obstacleFrontGfx=this.add.graphics().setDepth(18);
    this.crosshairGfx =this.add.graphics().setDepth(110);
    this.p2CrosshairGfx=this.add.graphics().setDepth(109);
    this.vignetteGfx  =this.add.graphics().setDepth(380);

    this.crosshairX=this.grannyX;this.crosshairY=H/3;
    this.schedulePickup();this.scheduleGolden();this.schedulePowerup();

    this.input.once('pointerdown',()=>this.audio.init());
    this.input.keyboard.once('keydown',()=>this.audio.init());

    if(this.mode===2)this.showInstructions();
  }

  // ═══════════════════════════════════════
  //  INSTRUCTION OVERLAY  (2P only)
  // ═══════════════════════════════════════
  showInstructions(){
    const ov=this.add.container(0,0).setDepth(500);

    // Dark backdrop
    const bg=this.add.rectangle(W/2,H/2,W,H,0x000000,0.82);ov.add(bg);

    // Title
    ov.add(this.add.text(W/2,38,'GET READY!',{fontSize:'36px',fill:'#FFD700',stroke:'#000',strokeThickness:6,fontFamily:'Arial Black,Arial'}).setOrigin(0.5));

    // ── Granddad panel (left) ──
    const lp=this.add.graphics();
    lp.fillStyle(0x1A3355,0.95);lp.fillRoundedRect(30,70,420,390,14);
    lp.lineStyle(3,0x4488FF,0.8);lp.strokeRoundedRect(30,70,420,390,14);
    ov.add(lp);
    const lItems=[
      [W/4+15,90,'👴  GRANDDAD','#FFCC44','Arial Black,Arial',22],
      [W/4+15,122,'You\'re on the LEFT side','#88CCFF','Arial,sans-serif',14],
      [60,170,'MOVE','#88FFCC','Arial Black,Arial',13],
      [60,195,'AIM  LEFT / RIGHT','#88FFCC','Arial Black,Arial',13],
      [60,220,'AIM  UP / DOWN','#88FFCC','Arial Black,Arial',13],
      [60,245,'FIRE  (toggle)','#88FFCC','Arial Black,Arial',13],
    ];
    lItems.forEach(([x,y,txt,col,fam,sz])=>ov.add(this.add.text(x,y,txt,{fontSize:`${sz}px`,fill:col,fontFamily:fam}).setOrigin(0)));

    // Control key badges — Granddad
    const keyBadge=(x,y,keys,col='#FFFFFF')=>{
      const g=this.add.graphics();
      keys.forEach((k,i)=>{
        g.fillStyle(0x334466,1);g.fillRoundedRect(x+i*44,y,40,26,5);
        g.lineStyle(2,0x6688AA,1);g.strokeRoundedRect(x+i*44,y,40,26,5);
        ov.add(g);
        ov.add(this.add.text(x+i*44+20,y+13,k,{fontSize:'13px',fill:'#FFFFFF',stroke:'#000',strokeThickness:2,fontFamily:'Arial Black,Arial'}).setOrigin(0.5));
      });
    };
    keyBadge(260,163,['A','D']);
    keyBadge(260,188,['Q','E']);
    keyBadge(260,213,['R','F']);
    keyBadge(260,238,['SHIFT']);

    // Separator arrow
    ov.add(this.add.graphics().fillStyle(0xFFFFFF,0.08).fillRect(W/2-2,70,4,390));

    // ── Granny panel (right) ──
    const rp=this.add.graphics();
    rp.fillStyle(0x3A1155,0.95);rp.fillRoundedRect(W/2+10,70,420,390,14);
    rp.lineStyle(3,0xAA44FF,0.8);rp.strokeRoundedRect(W/2+10,70,420,390,14);
    ov.add(rp);
    const rItems=[
      [3*W/4+40,90,'👵  GRANNY','#FF88CC','Arial Black,Arial',22],
      [W/2+20,122,'You\'re on the RIGHT side','#FFAACC','Arial,sans-serif',14],
      [W/2+20,170,'MOVE','#FFBBEE','Arial Black,Arial',13],
      [W/2+20,195,'AIM','#FFBBEE','Arial Black,Arial',13],
      [W/2+20,220,'FIRE  (toggle)','#FFBBEE','Arial Black,Arial',13],
    ];
    rItems.forEach(([x,y,txt,col,fam,sz])=>ov.add(this.add.text(x,y,txt,{fontSize:`${sz}px`,fill:col,fontFamily:fam}).setOrigin(0)));
    keyBadge(W/2+120,163,['←','→']);
    ov.add(this.add.text(W/2+120,195,'Trackpad / Mouse',{fontSize:'13px',fill:'#DDBBFF',fontFamily:'Arial,sans-serif'}));
    keyBadge(W/2+120,213,['SPACE']);

    // Shared goal
    ov.add(this.add.text(W/2,472,'🎯  Work together — spin ALL the spinners to trigger SPLASH FRENZY! 💦',{fontSize:'13px',fill:'#AADDFF',fontFamily:'Arial,sans-serif'}).setOrigin(0.5));

    // Countdown
    const countdown=this.add.text(W/2,500,'Starting in 4...',{fontSize:'15px',fill:'#FFDD88',fontFamily:'Arial Black,Arial'}).setOrigin(0.5);
    ov.add(countdown);

    let t=4;
    this.time.addEvent({delay:1000,repeat:4,callback:()=>{
      t--;if(t<=0){this.tweens.add({targets:ov,alpha:0,duration:400,onComplete:()=>ov.destroy()});}
      else countdown.setText(`Starting in ${t}...`);
    }});
  }

  // ═══════════════════════════════════════
  //  BACKGROUND
  // ═══════════════════════════════════════
  buildBg(){
    const bg=this.wc.bg;
    if(bg==='fence'){
      const sky=this.add.graphics();sky.fillGradientStyle(0x87CEEB,0x87CEEB,0xB0E2FF,0xB0E2FF,1);sky.fillRect(0,0,W,H*0.66);
      const f=this.add.graphics();for(let x=0;x<W;x+=78){const sh=Phaser.Math.Between(200,215);f.fillStyle(Phaser.Display.Color.GetColor(sh,sh-30,sh-55));f.fillRect(x,0,74,H*0.66);}
      f.fillStyle(0x8B5E3C);f.fillRect(0,H*.20,W,12);f.fillRect(0,H*.50,W,12);f.fillStyle(0xA0714A,0.5);f.fillRect(0,H*.20,W,4);f.fillRect(0,H*.50,W,4);
    } else if(bg==='pegboard'){
      const pg=this.add.graphics();pg.fillGradientStyle(0x2a1a0a,0x2a1a0a,0x1a0f06,0x1a0f06,1);pg.fillRect(0,0,W,H*0.68);
      const holes=this.add.graphics();holes.fillStyle(0x000000,0.5);for(let px=30;px<W;px+=30)for(let py=18;py<H*0.66;py+=30)holes.fillCircle(px,py,3);
      pg.fillStyle(0x5a3a1a);pg.fillRect(0,H*.22,W,10);pg.fillRect(0,H*.50,W,10);
    } else if(bg==='funfair'){
      const f=this.add.graphics();const sc=[0xFF3333,0xFFFFFF,0xFFCC00,0xFF3333,0xFFFFFF,0xFFCC00];for(let x=0;x<W;x+=55){f.fillStyle(sc[Math.floor(x/55)%6]);f.fillRect(x,0,55,H*0.66);}
      const fl=this.add.graphics();const fc=[0xFF3333,0xFFCC00,0x3399FF,0xFF88CC,0x44CC44];for(let x=0;x<W;x+=55){fl.fillStyle(fc[Math.floor(x/55)%5]);fl.fillTriangle(x,0,x+55,0,x+27,28);}
      fl.fillStyle(0xFFFFFF,0.6);for(let x=0;x<W;x+=30)fl.fillCircle(x,H*0.66,14);
      fl.lineStyle(2,0xCC2222,0.5);fl.lineBetween(0,H*0.22,W,H*0.22);fl.lineBetween(0,H*0.48,W,H*0.48);
    } else if(bg==='kitchen'){
      const kw=this.add.graphics();kw.fillStyle(0xF2EDE0);kw.fillRect(0,0,W,H*0.66);

  // ═══════════════════════════════════════
  //  SPINNERS
  // ═══════════════════════════════════════
  buildSpinners(){
    this.spinners=[];
    let{cols,rows,mx,my,sy}=this.wc.grid;
    // More spinners in 2P mode
    if(this.mode===2&&cols<5){cols=Math.min(cols+1,5);}
    const sx=(W-mx*2)/(cols-1);
    const types=this.wc.types;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
      this.makeSpinner(mx+c*sx,my+r*sy,types[(r*cols+c)%types.length]);
    if(this.wc.movingTargets){
      const picks=Phaser.Utils.Array.Shuffle(this.spinners.slice()).slice(0,3);
      picks.forEach(s=>{s.baseX=s.x;s.driftRange=55;s.driftSpeed=0.4+Math.random()*0.4;s.driftPhase=Math.random()*Math.PI*2;});
    }
  }

  makeSpinner(x,y,typeKey,opts={}){
    const type=ST[typeKey];
    const s={x,y,typeKey,type,currentSpeed:0,state:S.STOPPED,angle:0,hitCooldown:0,lastFullTime:0,lastBonusTime:0,isGolden:type.isGolden||false,lifetime:opts.lifetime||null,maxLifetime:opts.lifetime||null,baseX:null,driftRange:0,driftSpeed:0,driftPhase:0,container:this.add.container(x,y).setDepth(10)};
    s.glowGfx=this.add.graphics();s.bladeGfx=this.add.graphics();
    const pin=this.add.graphics();pin.fillStyle(0x888888);pin.fillCircle(0,0,7);pin.fillStyle(0x555555);pin.fillCircle(0,0,4);pin.lineStyle(1.5,0x333333);pin.strokeCircle(0,0,7);
    s.container.add([s.glowGfx,s.bladeGfx,pin]);
    this.redrawSpinner(s);this.spinners.push(s);return s;
  }

  _dim(col,d){const r=Math.floor(((col>>16)&0xFF)*d),g=Math.floor(((col>>8)&0xFF)*d),b=Math.floor((col&0xFF)*d);return(r<<16)|(g<<8)|b;}
  redrawSpinner(s){const g=s.bladeGfx;g.clear();const{type,state}=s,r=type.r,dim=[0.38,0.65,0.85,1.0][state];if(type.style==='cog')this._drawCog(g,r,dim,type.colors);else if(type.style==='disco')this._drawDisco(g,r,dim,type.colors);else if(type.style==='golden')this._drawGolden(g,r,dim,type.colors);else{for(let i=0;i<type.blades;i++){const a=(i/type.blades)*Math.PI*2;g.fillStyle(this._dim(type.colors[i%type.colors.length],dim),1);if(type.style==='pinwheel'){const sw=Math.PI*0.44;g.beginPath();g.moveTo(0,0);for(let t=0;t<=1.01;t+=0.1){const ang=a+t*sw,d2=r*(0.18+t*0.82);g.lineTo(Math.cos(ang)*d2,Math.sin(ang)*d2);}g.lineTo(Math.cos(a+sw*0.5)*r*0.22,Math.sin(a+sw*0.5)*r*0.22);g.closePath();g.fillPath();}else if(type.style==='fan'){const sw=Math.PI*0.3,inn=r*0.18;g.beginPath();g.moveTo(Math.cos(a-sw/2)*inn,Math.sin(a-sw/2)*inn);g.lineTo(Math.cos(a-sw/2)*r,Math.sin(a-sw/2)*r);g.lineTo(Math.cos(a)*r*1.05,Math.sin(a)*r*1.05);g.lineTo(Math.cos(a+sw/2)*r,Math.sin(a+sw/2)*r);g.lineTo(Math.cos(a+sw/2)*inn,Math.sin(a+sw/2)*inn);g.closePath();g.fillPath();}else if(type.style==='windmill'){const hw=9,cx=Math.cos(a),cy=Math.sin(a),px=Math.cos(a+Math.PI/2),py=Math.sin(a+Math.PI/2);g.beginPath();g.moveTo(px*hw,py*hw);g.lineTo(cx*r+px*hw,cy*r+py*hw);g.lineTo(cx*r-px*hw,cy*r-py*hw);g.lineTo(-px*hw,-py*hw);g.closePath();g.fillPath();g.lineStyle(1.5,0x00000033);g.strokePath();}else if(type.style==='propeller'){const sw=Math.PI*0.24;g.beginPath();g.moveTo(0,0);for(let t=0;t<=1.01;t+=0.1){const ang=a+t*sw,d2=r*(0.1+t*0.9);g.lineTo(Math.cos(ang)*d2,Math.sin(ang)*d2);}for(let t=1;t>=-0.01;t-=0.1){const ang=a+t*sw+0.38,d2=r*(0.1+t*0.9)*0.5;g.lineTo(Math.cos(ang)*d2,Math.sin(ang)*d2);}g.closePath();g.fillPath();}else if(type.style==='whirligig'){const sw=Math.PI*0.28;g.beginPath();g.moveTo(Math.cos(a)*r*0.12,Math.sin(a)*r*0.12);for(let t=0;t<=1.01;t+=0.1){const ang=a+t*sw,d2=r*(0.12+t*0.85);g.lineTo(Math.cos(ang)*d2,Math.sin(ang)*d2);}g.lineTo(Math.cos(a+sw+0.12)*r*0.45,Math.sin(a+sw+0.12)*r*0.45);g.lineTo(Math.cos(a+0.18)*r*0.12,Math.sin(a+0.18)*r*0.12);g.closePath();g.fillPath();}}}const gl=s.glowGfx;gl.clear();if(state===S.FULL){const gc=type.style==='golden'?0xFFFF00:type.style==='disco'?0xFF88FF:0xFFDD00;gl.fillStyle(gc,type.style==='golden'?0.4:0.22);gl.fillCircle(0,0,r+14);gl.fillStyle(0xFFFF88,0.1);gl.fillCircle(0,0,r+28);}else if(state===S.MEDIUM){gl.fillStyle(0xCCCCFF,0.14);gl.fillCircle(0,0,r+8);}else if(state===S.SLOW){gl.fillStyle(0xFFBB44,0.08);gl.fillCircle(0,0,r+4);}}
  _drawCog(g,r,dim,c){const teeth=10,inn=r*0.62,tw=Math.PI/teeth*0.55;g.fillStyle(this._dim(c[0],dim),1);g.beginPath();for(let i=0;i<teeth;i++){const b=(i/teeth)*Math.PI*2;g.lineTo(Math.cos(b-tw)*inn,Math.sin(b-tw)*inn);g.lineTo(Math.cos(b-tw)*r,Math.sin(b-tw)*r);g.lineTo(Math.cos(b+tw)*r,Math.sin(b+tw)*r);g.lineTo(Math.cos(b+tw)*inn,Math.sin(b+tw)*inn);}g.closePath();g.fillPath();g.lineStyle(1.5,this._dim(c[1],dim*0.5),0.7);for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;g.lineBetween(Math.cos(a)*inn*0.25,Math.sin(a)*inn*0.25,Math.cos(a)*inn*0.95,Math.sin(a)*inn*0.95);}g.fillStyle(this._dim(c[3],dim*0.7),1);g.fillCircle(0,0,inn*0.3);}
  _drawDisco(g,r,dim,c){g.fillStyle(this._dim(c[0],dim),1);g.fillCircle(0,0,r);const gs=r/4;for(let gx=-r;gx<r;gx+=gs)for(let gy=-r;gy<r;gy+=gs){const cx=gx+gs/2,cy=gy+gs/2;if(Math.sqrt(cx*cx+cy*cy)<r-1){const bright=(Math.floor(gx/gs)+Math.floor(gy/gs))%2===0;g.fillStyle(bright?0xFFFFFF:0x777777,dim*0.65);g.fillRect(gx+1,gy+1,gs-2,gs-2);}}g.lineStyle(1.5,0x444444,0.4);g.strokeCircle(0,0,r);}
  _drawGolden(g,r,dim,c){const out=r,inn=r*0.4;g.fillStyle(this._dim(c[0],dim),1);g.beginPath();for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2-Math.PI/2,rad=i%2===0?out:inn;if(i===0)g.moveTo(Math.cos(a)*rad,Math.sin(a)*rad);else g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);}g.closePath();g.fillPath();g.fillStyle(this._dim(c[2],dim),1);g.beginPath();for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2-Math.PI/2,rad=(i%2===0?out:inn)*0.55;if(i===0)g.moveTo(Math.cos(a)*rad,Math.sin(a)*rad);else g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);}g.closePath();g.fillPath();}

  // ═══════════════════════════════════════
  //  OBSTACLES / PICKUPS / POWERUPS
  // ═══════════════════════════════════════
  buildObstacles(){this.wc.obs.forEach(type=>{if(type==='CAT'){const target=this.spinners[Phaser.Math.Between(0,this.spinners.length-1)];this.obstacles.push({type:'CAT',target,state:'sitting',returnTimer:0,x:target.x,y:target.y});}else if(type==='UMBRELLA'){let x,y,tries=0;do{x=Phaser.Math.Between(120,W-120);y=Phaser.Math.Between(50,300);tries++;}while(tries<20&&this.spinners.some(s=>Phaser.Math.Distance.Between(x,y,s.x,s.y)<70));this.obstacles.push({type:'UMBRELLA',x,y,isOpen:false,timer:Phaser.Math.FloatBetween(1.5,3.0)});}else if(type==='DUCK'){this.obstacles.push({type:'DUCK',x:Phaser.Math.Between(100,W-100),y:Phaser.Math.Between(80,280),vx:(Math.random()>0.5?1:-1)*70});}});}
  updateObstacles(dt){const g=this.obstacleFrontGfx;g.clear();for(const ob of this.obstacles){if(ob.type==='CAT')this._updateCat(ob,dt,g);else if(ob.type==='UMBRELLA')this._updateUmbrella(ob,dt,g);else if(ob.type==='DUCK')this._updateDuck(ob,dt,g);}}
  _updateCat(ob,dt,g){if(ob.state==='sitting'){ob.x=ob.target.x;ob.y=ob.target.y;ob.target.currentSpeed=Math.min(ob.target.currentSpeed,30);this._drawCat(g,ob.x,ob.y-ob.target.type.r-22);for(const p of this.waterParticles){if(p.dead)continue;if(Phaser.Math.Distance.Between(p.x,p.y,ob.x,ob.y-ob.target.type.r-14)<22){p.dead=true;ob.state='fleeing';ob.returnTimer=10;ob.fleeX=ob.x+(Math.random()>0.5?W:-W);this.splash(ob.x,ob.y-ob.target.type.r-14,0xFFAA44,6);this.showFloat(ob.x,ob.y-ob.target.type.r-40,'😾 SHOO!','#FFAA44');this.audio.playShoo();break;}}}else{ob.returnTimer-=dt;ob.x+=Math.sign(ob.fleeX-ob.x)*200*dt;if(ob.returnTimer<=0){ob.state='sitting';ob.target=this.spinners[Phaser.Math.Between(0,this.spinners.length-1)];}}}

  spawnPowerup(){const types=Object.keys(PU),type=types[Phaser.Math.Between(0,types.length-1)];let x,y,tries=0;do{x=Phaser.Math.Between(80,W-80);y=Phaser.Math.Between(30,310);tries++;}while(tries<20&&[...this.spinners,...this.powerups].some(s=>Phaser.Math.Distance.Between(x,y,s.x,s.y)<55));this.powerups.push({type,x,y,life:14,maxLife:14,dead:false});this.showFloat(x,y-30,`${PU[type].label} ${PU[type].name}!`,'#FFEEAA');}

  // ═══════════════════════════════════════
  //  INPUT
  // ═══════════════════════════════════════
  setupInput(){
    // ── Detect touch device ──
    this.isMobile = this.sys.game.device.input.touch;
    this.vLeft=false; this.vRight=false;     // virtual D-pad state
    this._aimPointerId=-1;                    // which pointer is steering aim

    // Keyboard (desktop / physical keyboard on mobile)
    this.cursors=this.input.keyboard.createCursorKeys();
    this.spaceKey=this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    this.aKey   =this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
    this.dKey   =this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D);
    this.qKey   =this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.Q);
    this.eKey   =this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.E);
    this.rKey   =this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);
    this.fKey   =this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.F);
    this.shiftKey=this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SHIFT);

    // ── Aim: mouse moves + touch drags in the wall zone ──
    const WALL_Y = H * 0.72;
    const updateAim=(p)=>{ if(p.y<WALL_Y){ this.crosshairX=p.x; this.crosshairY=p.y; } };
    this.input.on('pointermove', p=>updateAim(p));
    this.input.on('pointerdown', p=>{ if(p.y<WALL_Y){ updateAim(p); } });

    // ── Keyboard fire toggles ──
    this.spaceKey.on('down',()=>{ this.audio.resume();this._fireToggle=!this._fireToggle;this._flipGranny(this._fireToggle); });
    if(this.mode===2){
      this.shiftKey.on('down',()=>{ this.audio.resume();this.p2FireToggle=!this.p2FireToggle;this._flipGranddad(this.p2FireToggle); });
    }

    // ── Build virtual gamepad (touch only) ──
    if(this.isMobile) this._buildVirtualPad();

    // Cursor
    if(!this.isMobile) this.input.setDefaultCursor('none');
    this.crosshairX=this.grannyX; this.crosshairY=H/3;
  }

  // ─────────────────────────────────────────
  //  Virtual gamepad — shown on touch devices
  // ─────────────────────────────────────────
  _buildVirtualPad(){
    const D=60; // button radius target
    const BY=H-36, alpha=0.18, activeAlpha=0.55;
    const btnStyle={fontSize:'26px',stroke:'#000',strokeThickness:2,fontFamily:'Arial Black,Arial'};
    const desc={fontSize:'10px',fill:'#FFFFFF',fontFamily:'Arial,sans-serif'};

    // ── LEFT button ──
    const lBg=this.add.circle(D,BY,D,0xFFFFFF,alpha).setDepth(600).setInteractive();
    this.add.text(D,BY,'◀',{...btnStyle,fill:'#FFFFFF'}).setOrigin(0.5).setDepth(601);
    this.add.text(D,BY+D-8,'MOVE',desc).setOrigin(0.5).setDepth(601);
    lBg.on('pointerdown',  ()=>{ this.vLeft=true;  lBg.setAlpha(activeAlpha); });
    lBg.on('pointerup',    ()=>{ this.vLeft=false; lBg.setAlpha(alpha); });
    lBg.on('pointerout',   ()=>{ this.vLeft=false; lBg.setAlpha(alpha); });

    // ── RIGHT button ──
    const rBg=this.add.circle(D*2+30,BY,D,0xFFFFFF,alpha).setDepth(600).setInteractive();
    this.add.text(D*2+30,BY,'▶',{...btnStyle,fill:'#FFFFFF'}).setOrigin(0.5).setDepth(601);
    this.add.text(D*2+30,BY+D-8,'MOVE',desc).setOrigin(0.5).setDepth(601);
    rBg.on('pointerdown',  ()=>{ this.vRight=true;  rBg.setAlpha(activeAlpha); });
    rBg.on('pointerup',    ()=>{ this.vRight=false; rBg.setAlpha(alpha); });
    rBg.on('pointerout',   ()=>{ this.vRight=false; rBg.setAlpha(alpha); });

    // ── FIRE button (large, right side) ──
    const FX=W-D-14;
    const fBg=this.add.circle(FX,BY,D+6,0xFF3388,alpha).setDepth(600).setInteractive();
    const fTxt=this.add.text(FX,BY,'💦',{fontSize:'32px'}).setOrigin(0.5).setDepth(601);
    this.add.text(FX,BY+D-4,'FIRE',{...desc,fill:'#FFAACC'}).setOrigin(0.5).setDepth(601);
    fBg.on('pointerdown',()=>{
      this.audio.resume();
      this._fireToggle=!this._fireToggle;
      this._flipGranny(this._fireToggle);
      fBg.setAlpha(this._fireToggle?activeAlpha:alpha);
      fTxt.setText(this._fireToggle?'🔥':'💦');
    });

    // ── AIM hint label (centre of button bar) ──
    this.add.text(W/2,BY+D-6,'drag above to aim',{fontSize:'10px',fill:'#666688',fontFamily:'Arial,sans-serif'}).setOrigin(0.5).setDepth(600);

    // ── Store refs so endGame can reset them ──
    this._vFireBg=fBg; this._vFireTxt=fTxt; this._vAlpha=alpha;
  }

  // ═══════════════════════════════════════
  //  CHARACTER ANIMATION METHODS
  // ═══════════════════════════════════════
  _flipGranny(faceWall){
    this.tweens.killTweensOf(this.grannyContainer);this._facingWall=faceWall;
    this.tweens.add({targets:this.grannyContainer,scaleX:0,duration:140,ease:'Quad.In',onComplete:()=>{
      this.grannyFront.setVisible(!faceWall);this.grannyBack.setVisible(faceWall);this.grannyGunGfx.setVisible(faceWall);
      if(faceWall){this.gunNozzleOffsetX=14;this.gunNozzleOffsetY=-32;}else{this.gunNozzleOffsetX=-88;this.gunNozzleOffsetY=-12;}
      this.tweens.add({targets:this.grannyContainer,scaleX:1,duration:140,ease:'Quad.Out'});
    }});
  }
  _flipGranddad(faceWall){
    this.tweens.killTweensOf(this.granddadContainer);this._p2FacingWall=faceWall;
    this.tweens.add({targets:this.granddadContainer,scaleX:0,duration:140,ease:'Quad.In',onComplete:()=>{
      this.granddadFront.setVisible(!faceWall);this.granddadBack.setVisible(faceWall);this.granddadGunGfx.setVisible(faceWall);
      if(faceWall){this.p2NozzleOffsetX=-14;this.p2NozzleOffsetY=-32;}else{this.p2NozzleOffsetX=88;this.p2NozzleOffsetY=-12;}
      this.tweens.add({targets:this.granddadContainer,scaleX:1,duration:140,ease:'Quad.Out'});
    }});
  }

  _drawDynamicGun(container,aimX,aimY,posX,posY,gfx,hoseCol,p2=false){
    const g=gfx;g.clear();
    const dx=aimX-posX,dy=aimY-posY;
    const angle=Math.atan2(dy,dx),cos=Math.cos(angle),sin=Math.sin(angle),pc=-sin,ps=cos;
    const hx=p2?-14:14,hy=-32,bLen=64,bW=5,nLen=10;

    g.fillStyle(0xFF5544,1);g.fillRoundedRect(hx+cos*12+pc*14-4,hy+sin*12+ps*14-4,8,8,3);
    g.fillStyle(0x88CCFF,0.75);g.fillCircle(hx+cos*26+pc*8,hy+sin*26+ps*8,3);g.fillCircle(hx+cos*40-pc*6,hy+sin*40-ps*6,2.5);

  calcAim(){
    // P1 aim (trackpad)
    let ax=this.crosshairX,ay=this.crosshairY,best=65,snap=false,target=null;
    for(const s of this.spinners){const d=Phaser.Math.Distance.Between(ax,ay,s.x,s.y);if(d<best){best=d;ax=s.x;ay=s.y;snap=true;target=s;}}

  update(time,delta){
    if(this.gameOver)return;const dt=delta/1000;
    this.updateGranny(dt);
    if(this.mode===2)this.updateGranddad(dt,time);
    this.updateWaterGun(dt,time);
    if(this.mode===2)this.updateP2WaterGun(dt,time);
    this.updateSpinners(dt,time);
    this.updateParticles(dt);this.updateStarParticles(dt);this.updateCombo(dt);
    this.updateFrenzy(dt);this.updatePickups(dt);this.updatePowerups(dt);
    this.updateFloatingTexts(dt);this.updateObstacles(dt,time);
    this.updateGolden(dt);this.updateDiscoFlares(dt);
    this.drawRings();this.calcAim();
    if(this._facingWall){const n=this._drawDynamicGun(this.grannyContainer,this.aimX,this.aimY,this.grannyX,this.grannyContainer.y,this.grannyGunGfx,0x2266CC,false);this.gunNozzleOffsetX=n.ox;this.gunNozzleOffsetY=n.oy;}
    if(this.mode===2&&this._p2FacingWall){const n=this._drawDynamicGun(this.granddadContainer,this.p2AimXSnapped||this.p2AimX,this.p2AimYSnapped||this.p2AimY,this.granddadX,this.granddadContainer.y,this.granddadGunGfx,0x4A7A3A,true);this.p2NozzleOffsetX=n.ox;this.p2NozzleOffsetY=n.oy;}
    this.updateTimer(dt);this.updateHUD();
    this.drawCrosshair();
    if(this.mode===2)this.drawP2Crosshair();
  }

  updateGranny(dt){
    const left =(this.cursors.left.isDown  || this.vLeft);
    const right=(this.cursors.right.isDown || this.vRight);
    if(left) this.grannyX-=this.grannySpeed*dt;
    if(right)this.grannyX+=this.grannySpeed*dt;
    this.grannyX=Phaser.Math.Clamp(this.grannyX,55,W-55);
    this.grannyContainer.x=this.grannyX;this.grannyBob+=dt*3.5;
    this.grannyContainer.y=H*0.66-8+Math.sin(this.grannyBob)*2.5;
    this.gunX=this.grannyX+this.gunNozzleOffsetX;this.gunY=this.grannyContainer.y+this.gunNozzleOffsetY;
  }

  updateGranddad(dt,time){
    // Move with A/D
    if(this.aKey.isDown)this.granddadX-=this.granddadSpeed*dt;
    if(this.dKey.isDown)this.granddadX+=this.granddadSpeed*dt;
    this.granddadX=Phaser.Math.Clamp(this.granddadX,55,W-55);
    this.granddadContainer.x=this.granddadX;this.granddadBob+=dt*3.5;
    this.granddadContainer.y=H*0.66-8+Math.sin(this.granddadBob)*2.5;
    this.p2GunX=this.granddadX+this.p2NozzleOffsetX;this.p2GunY=this.granddadContainer.y+this.p2NozzleOffsetY;
    // Move P2 aim with Q/E/R/F
    if(this.qKey.isDown)this.p2AimX-=this.p2AimSpeed*dt;
    if(this.eKey.isDown)this.p2AimX+=this.p2AimSpeed*dt;
    if(this.rKey.isDown)this.p2AimY-=this.p2AimSpeed*dt;
    if(this.fKey.isDown)this.p2AimY+=this.p2AimSpeed*dt;
    this.p2AimX=Phaser.Math.Clamp(this.p2AimX,40,W-40);
    this.p2AimY=Phaser.Math.Clamp(this.p2AimY,20,H*0.62);
  }

  updateWaterGun(dt,time){
    const shooting=this._fireToggle&&!this.isPumping&&this.waterTank>0;
    if(shooting&&!this._wasStreaming){this.audio.startStream();this._wasStreaming=true;}
    if(!shooting&&this._wasStreaming){this.audio.stopStream();this._wasStreaming=false;}
    if(this.isPumping){this.pumpTimer-=dt;if(this.pumpTimer<=0){this.isPumping=false;this.waterTank=100;this.pumpText.setVisible(false);this.audio.playRefill();this.showFloat(this.grannyX,H*0.66-90,'💧 REFILLED!','#FFAACC');}return;}
    if(shooting){this.waterTank-=5*dt;if(this.waterTank<=0){this.waterTank=0;this.isPumping=true;this.pumpTimer=2.0;this.pumpText.setVisible(true);this.audio.stopStream();this._wasStreaming=false;this.audio.playPump();}
      if(time>=this._nextSpawn){this._nextSpawn=time+28;this._spawnWater(this.gunX,this.gunY,this.aimX,this.aimY,this.aimTarget,0);

      }
    }
  }

  updateP2WaterGun(dt,time){
    const tx=this.p2AimXSnapped||this.p2AimX,ty=this.p2AimYSnapped||this.p2AimY;

    if(this.p2IsPumping){this.p2PumpTimer-=dt;if(this.p2PumpTimer<=0){this.p2IsPumping=false;this.p2WaterTank=100;this.pumpText.setVisible(false);this.audio.playRefill();this.showFloat(this.granddadX,H*0.66-90,'💧 REFILLED!','#AACCFF');}return;}
    if(shooting){this.p2WaterTank-=5*dt;if(this.p2WaterTank<=0){this.p2WaterTank=0;this.p2IsPumping=true;this.p2PumpTimer=2.0;this.pumpText.setVisible(true);this.audio.stopStreamP2();this.p2WasStreaming=false;this.audio.playPump();}
      if(time>=this.p2NextSpawn){this.p2NextSpawn=time+28;this._spawnWater(this.p2GunX,this.p2GunY,tx,ty,this.p2AimTarget,0,2);}
