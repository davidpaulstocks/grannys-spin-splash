  }

  _spawnWater(ox,oy,tx,ty,target,wobbleExtra=0,player=1){
    const dist=Math.max(10,Phaser.Math.Distance.Between(ox,oy,tx,ty));
    const spd=650,wobble=(Math.random()-0.5)*0.04+wobbleExtra;
    const dx=(tx-ox)/dist+wobble,dy=(ty-oy)/dist,life=(dist/spd)*1.4+0.1;
    this.waterParticles.push({x:ox,y:oy,vx:dx*spd,vy:dy*spd,gravity:90,life,maxLife:life,sz:player===2?4.5:3.5+Math.random()*2.5,target,player,dead:false});
  }

  updateParticles(dt){
    const wg=this.waterGfx;wg.clear();
    for(const p of this.waterParticles){if(p.dead)continue;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;p.life-=dt;if(p.life<=0||p.x<-10||p.x>W+10||p.y>H+10){p.dead=true;continue;}const a=Math.min(1,p.life/(p.maxLife*0.4));const col=p.player===2?0x66DDBB:(this.fx.soaker>0?0x88DDFF:0x55BBFF);wg.fillStyle(col,a);wg.fillCircle(p.x,p.y,p.sz);wg.fillStyle(0xAAEEFF,a*0.4);wg.fillCircle(p.x-1,p.y-1,p.sz*0.5);}
    if(this.waterParticles.length>400)this.waterParticles=this.waterParticles.filter(p=>!p.dead);
    const sg=this.splashGfx;sg.clear();for(const p of this.splashParticles){if(p.dead)continue;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=320*dt;p.life-=dt;if(p.life<=0){p.dead=true;continue;}const a=p.life/p.maxLife;sg.fillStyle(p.col,a);sg.fillCircle(p.x,p.y,p.sz*(0.4+a*0.6));}
    if(this.splashParticles.length>150)this.splashParticles=this.splashParticles.filter(p=>!p.dead);
  }
  splash(x,y,col=0x55BBFF,n=10){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,spd=60+Math.random()*180;this.splashParticles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-60,life:0.35+Math.random()*0.3,maxLife:0.65,sz:2.5+Math.random()*4,col,dead:false});}}

  updateStarParticles(dt){const g=this.starGfx;g.clear();for(const p of this.starParticles){if(p.dead)continue;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=40*dt;p.life-=dt;if(p.life<=0){p.dead=true;continue;}const a=Math.min(1,p.life*2.5),sz=p.sz*(0.5+a*0.5);g.fillStyle(0xFFDD00,a);for(let j=0;j<5;j++){const ang=(j/5)*Math.PI*2-Math.PI/2,r1=sz,r2=sz*0.45,x1=p.x+Math.cos(ang)*r1,y1=p.y+Math.sin(ang)*r1,a2=ang+Math.PI/5,x2=p.x+Math.cos(a2)*r2,y2=p.y+Math.sin(a2)*r2;if(j===0){g.beginPath();g.moveTo(x1,y1);}else{g.lineTo(x2,y2);g.lineTo(x1,y1);}}g.closePath();g.fillPath();}if(this.starParticles.length>100)this.starParticles=this.starParticles.filter(p=>!p.dead);}
  popStars(x,y,count){for(let i=0;i<Math.min(count,6);i++){const a=-Math.PI/2+(Math.random()-0.5)*Math.PI;this.starParticles.push({x:x+(Math.random()-0.5)*20,y,vx:Math.cos(a)*(40+Math.random()*80),vy:Math.sin(a)*(80+Math.random()*120)-60,life:0.8+Math.random()*0.4,sz:8+Math.random()*6,dead:false});}}
  showFloat(x,y,msg,color='#FFD700'){const t=this.add.text(x,y,msg,{fontSize:'18px',fill:color,stroke:'#000',strokeThickness:3,fontFamily:'Arial Black,Arial'}).setOrigin(0.5).setDepth(160);this.floatingTexts.push({obj:t,vy:-72,life:1.1});}
  updateFloatingTexts(dt){for(const ft of this.floatingTexts){ft.life-=dt;ft.obj.y+=ft.vy*dt;ft.vy*=0.94;ft.obj.setAlpha(Math.min(1,ft.life*2));if(ft.life<=0)ft.obj.destroy();}this.floatingTexts=this.floatingTexts.filter(f=>f.life>0);}

  updateDiscoFlares(dt){this.discoFlareTimer-=dt;if(this.discoFlareTimer>0)return;this.discoFlareTimer=0.4;const rc=[0xFF4444,0xFF8844,0xFFFF44,0x44FF44,0x44AAFF,0xFF44FF];for(const s of this.spinners){if(s.typeKey==='DISCO'&&s.state===S.FULL){for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2+s.angle,spd=60+Math.random()*80;this.splashParticles.push({x:s.x,y:s.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:0.6+Math.random()*0.3,maxLife:0.9,sz:4+Math.random()*3,col:rc[i%6],dead:false});}}}}

  drawRings(){const g=this.ringGfx;g.clear();for(const s of this.spinners){if(s.currentSpeed<=0)continue;const pct=s.currentSpeed/100,r=s.type.r+7;const col=s.state===S.FULL?0xFFDD00:s.state===S.MEDIUM?0xBBBBFF:0xFFAA44;g.lineStyle(3,0x000000,0.2);g.strokeCircle(s.x,s.y,r);g.lineStyle(3,col,0.8);g.beginPath();g.arc(s.x,s.y,r,-Math.PI/2,-Math.PI/2+pct*Math.PI*2,false);g.strokePath();if(s.isGolden&&s.lifetime!=null){const lp=s.lifetime/s.maxLifetime;g.lineStyle(4,lp>0.4?0xFF8800:0xFF2200,0.9);g.beginPath();g.arc(s.x,s.y,r+6,-Math.PI/2,-Math.PI/2+lp*Math.PI*2,false);g.strokePath();}if(this.fx.spinlock>0&&s.state!==S.STOPPED){g.lineStyle(2,0x44CC44,0.5);g.strokeCircle(s.x,s.y,r+12);}}}

  updateSpinners(dt,time){
    for(const s of this.spinners){
      if(s.driftRange>0){s.driftPhase+=dt*s.driftSpeed;s.x=s.baseX+Math.sin(s.driftPhase)*s.driftRange;s.container.x=s.x;}
      if((!this.splashFrenzy||s.state!==S.FULL)&&this.fx.spinlock<=0)s.currentSpeed=Math.max(0,s.currentSpeed-s.type.decay*dt);
      const prev=s.state;
      if(s.currentSpeed<=0)s.state=S.STOPPED;else if(s.currentSpeed<40)s.state=S.SLOW;else if(s.currentSpeed<80)s.state=S.MEDIUM;else s.state=S.FULL;
      if(s.state!==prev){this.redrawSpinner(s);if(s.state>prev){this.awardStars(s.x,s.y,s.type.stars+Math.max(0,s.state-1));this.audio.playUpgrade(s.state);}if(s.state===S.FULL)s.lastFullTime=time;}
      if(s.state===S.FULL&&s.lastFullTime&&(time-s.lastFullTime)>10000)if(!s.lastBonusTime||(time-s.lastBonusTime)>5000){this.awardStars(s.x,s.y,1);s.lastBonusTime=time;}
      s.angle+=s.currentSpeed*0.065*dt;s.container.rotation=s.angle;if(s.hitCooldown>0)s.hitCooldown-=dt;
    }
    for(const p of this.waterParticles){if(p.dead)continue;const candidates=p.target?[p.target]:this.spinners;for(const s of candidates){const outerR=s.type.r+8,innerDead=s.typeKey==='COG'?s.type.r*0.42:0,d=Phaser.Math.Distance.Between(p.x,p.y,s.x,s.y);if(d<outerR&&d>innerDead){p.dead=true;if(s.type.deflects&&Math.random()<0.38){this.splash(p.x,p.y,0xFF8844,5);this.audio.playDeflect();}else{this.splash(p.x,p.y,p.player===2?0x66DDBB:0x55BBFF,7);this.onHitSpinner(s,time,p.player===2);}break;}}}
    if(!this.splashFrenzy&&this.spinners.every(s=>s.state===S.FULL))this.triggerFrenzy(time);
  }

  onHitSpinner(s,time,isP2=false){
    if(this.fx.goldenSplash){s.currentSpeed=100;this.fx.goldenSplash=false;this.splash(s.x,s.y,0xFFDD00,14);this.showFloat(s.x,s.y-50,'⭐ GOLDEN SPLASH!','#FFD700');this.audio.playGoldenAppear();return;}
    s.currentSpeed=Math.min(100,s.currentSpeed+s.type.power);
    const diff=s!==this.lastHitSpinner;
    if(diff){const prev=this.combo;this.combo=Math.min((this.combo||0)+1,5);this.comboTimer=2.0;if(this.combo!==prev){this.audio.playCombo(this.combo);if(this.combo>=4)this.cameras.main.shake(150,0.005*(this.combo-2));}}
    else this.combo=Math.max(1,this.combo);
    this.lastHitSpinner=s;this.audio.playHit(s.currentSpeed,isP2);this.splash(s.x,s.y,isP2?0x66DDBB:0x88CCFF,4);
    if(s.isGolden&&s.state===S.FULL){this.awardStars(s.x,s.y,s.type.stars);this.showFloat(s.x,s.y-55,'✨ GOLDEN! +10','#FFD700');this.audio.playGoldenAppear();}
  }

  updateCombo(dt){if(this.combo>1){this.comboTimer-=dt;if(this.comboTimer<=0){this.combo=1;this.lastHitSpinner=null;}}const labels=['','','x2 COMBO!','x3 COMBO!!','x4 COMBO!!!','🔥 x5 MAX!!'];const txt=this.combo>1?labels[this.combo]||`x${this.combo}`:'';this.comboText.setText(txt);if(this.combo>=4&&txt){this.comboText.setScale(1+Math.sin(this.time.now*0.01)*0.08);}else this.comboText.setScale(1);}
  awardStars(x,y,count){const dsMult=this.fx.doubleStars>0?2:1,mult=Math.max(1,this.combo)*dsMult,total=count*mult;this.score+=total;this.popStars(x,y,count);const lbl=mult>1?`+${total} ⭐ ×${mult}`:`+${total} ⭐`;this.showFloat(x,y-14+(x%18),lbl,this.fx.doubleStars>0?'#AA44FF':mult>=4?'#FF88FF':mult>=2?'#FFD700':'#FFFFFF');}
  triggerFrenzy(time){this.splashFrenzy=true;this.frenzyTimer=5.0;this.score+=25;this.spinners.forEach(s=>{s.currentSpeed=100;});this.popStars(W/2,H/2,8);this.showFloat(W/2,H/2-80,'+25 BONUS!','#FFD700');this.audio.playFrenzy();this.cameras.main.shake(500,0.012);this.tweens.add({targets:this.frenzyBanner,alpha:{from:0,to:1},scaleX:{from:0.4,to:1},scaleY:{from:0.4,to:1},duration:380,ease:'Back.Out'});this.tweens.add({targets:this.frenzySubText,alpha:{from:0,to:1},y:{from:H/2+70,to:H/2+40},duration:400,delay:200,ease:'Quad.Out'});const flash=this.add.rectangle(W/2,H/2,W,H,0xFFFFFF,0).setDepth(250);this.tweens.add({targets:flash,alpha:{from:0.8,to:0},duration:700,ease:'Quad.Out',onComplete:()=>flash.destroy()});for(let i=0;i<18;i++)this.time.delayedCall(i*160,()=>this.splash(Math.random()*W,Math.random()*H*0.6,[0x55AAFF,0xFFDD00,0xFF88FF,0x55FF88][i%4],14));}
  updateFrenzy(dt){if(!this.splashFrenzy)return;this.frenzyTimer-=dt;if(this.frenzyTimer<=0){this.splashFrenzy=false;this.tweens.add({targets:[this.frenzyBanner,this.frenzySubText],alpha:0,duration:500});}}

  updateTimer(dt){
    this.gameTime-=dt;if(this.gameTime<=0){this.gameTime=0;this.endGame();return;}
    const secs=Math.ceil(this.gameTime);
    this.timerText.setText(this._fmtTime(this.gameTime));

    if(secs<=10){
      // Pulsing red vignette
      const intensity=(10-secs)/10;
      this.vignetteGfx.clear();
      const bw=20+intensity*55;
      this.vignetteGfx.fillStyle(0xFF0000,intensity*0.35);
      this.vignetteGfx.fillRect(0,0,W,bw);this.vignetteGfx.fillRect(0,H-bw,W,bw);
      this.vignetteGfx.fillRect(0,0,bw,H);this.vignetteGfx.fillRect(W-bw,0,bw,H);
      this.timerText.setStyle({fill:'#FF2222'});
      this.timerText.setScale(1+Math.sin(this.time.now*0.025)*0.18);
    } else if(secs<=20){
      this.vignetteGfx.clear();
      this.timerText.setStyle({fill:'#FFAA22'});this.timerText.setScale(1);
    } else {
      this.vignetteGfx.clear();
      this.timerText.setStyle({fill:'#FFFFFF'});this.timerText.setScale(1);
    }

    if(secs!==this.lastTickSecond){
      this.lastTickSecond=secs;
      if(secs<=10){
        this.audio.playTick(secs<=3);
        this._showBigCountdown(secs);
        this.cameras.main.shake(secs<=3?300:150, secs<=3?0.012:0.006);
      } else if(secs===20){
        this.showFloat(W/2,H/2-60,'⏱  20 SECONDS!','#FFAA22');
      }
    }
  }

  _showBigCountdown(n){
    const isUrgent=n<=3;
    const label=n===0?'TIME\'S UP!':n===1?'1️⃣':n===2?'2️⃣':n===3?'3️⃣  GO GO GO!':n<=5?`${n}!`:`${n}`;
    const sz=isUrgent?110:n<=5?90:72;
    const col=isUrgent?'#FF2200':n<=5?'#FF8800':'#FFCC00';

    const txt=this.add.text(W/2,H/2-30,label,{
      fontSize:`${sz}px`, fill:col, stroke:'#000', strokeThickness:10,
      fontFamily:'Arial Black,Arial'
    }).setOrigin(0.5).setDepth(395).setAlpha(0).setScale(2.2);

    this.tweens.add({
      targets:txt, alpha:{from:1,to:0},
      scaleX:{from:2.2,to:isUrgent?0.7:1.0}, scaleY:{from:2.2,to:isUrgent?0.7:1.0},
      duration:isUrgent?900:750, ease:'Quad.Out',
      onComplete:()=>txt.destroy()
    });

    if(isUrgent){
      const flash=this.add.rectangle(W/2,H/2,W,H,0xFF0000,0).setDepth(390);
      this.tweens.add({targets:flash,alpha:{from:isUrgent?0.35:0.15,to:0},duration:350,onComplete:()=>flash.destroy()});
    }
  }

  endGame(){
    this.gameOver=true;this._fireToggle=false;this.p2FireToggle=false;
    this.vLeft=false;this.vRight=false;
    this._flipGranny(false);if(this.mode===2)this._flipGranddad(false);
    this.audio.stopStream();this.audio.stopStreamP2();
    this.vignetteGfx.clear();
    if(!this.isMobile)this.input.setDefaultCursor('auto');
    // Final massive flash
    const flash=this.add.rectangle(W/2,H/2,W,H,0xFFFFFF,0).setDepth(500);
    this.tweens.add({targets:flash,alpha:{from:0.9,to:0},duration:800,ease:'Quad.Out'});
    this.cameras.main.shake(600,0.02);
    this.time.delayedCall(1400,()=>this.scene.start('GameOverScene',{score:this.score,audio:this.audio,world:this.worldKey,mode:this.mode}));
  }

  updateHUD(){
    this.scoreText.setText('⭐  '+this.score);
    if(this._lastScore!==this.score){this._lastScore=this.score;this.tweens.add({targets:this.scoreText,scaleX:1.25,scaleY:1.25,duration:100,yoyo:true,ease:'Quad.Out'});}
    const pct=Phaser.Math.Clamp(this.waterTank/100,0,1);this.waterBarFill.scaleX=pct;this.waterBarFill.fillColor=pct<0.25?0xFF4422:pct<0.5?0xFFAA22:0xFF44AA;
    const af=this._fireToggle&&!this.isPumping&&this.waterTank>0?0.7+Math.sin(this.time.now*0.012)*0.3:0;this.firingDot.setAlpha(af);this.firingLabel.setAlpha(af);
    if(this.mode===2&&this.p2WaterBarFill){const p2pct=Phaser.Math.Clamp(this.p2WaterTank/100,0,1);this.p2WaterBarFill.scaleX=p2pct;this.p2WaterBarFill.fillColor=p2pct<0.25?0xFF4422:p2pct<0.5?0xFFAA22:0x44AAFF;const p2af=this.p2FireToggle&&!this.p2IsPumping&&this.p2WaterTank>0?0.7+Math.sin(this.time.now*0.012)*0.3:0;if(this.p2FiringDot)this.p2FiringDot.setAlpha(p2af);if(this.p2FiringLabel)this.p2FiringLabel.setAlpha(p2af);}
    const fc=this.spinners.filter(s=>s.state===S.FULL).length;this.progressText.setText(`${fc} / ${this.spinners.length}  💨`);
    this.fxBadges.SOAKER.setAlpha(this.fx.soaker>0?1:0);this.fxBadges.SPINLOCK.setAlpha(this.fx.spinlock>0?1:0);this.fxBadges.DOUBLE_STARS.setAlpha(this.fx.doubleStars>0?1:0);this.fxBadges.GOLDEN_SPLASH.setAlpha(this.fx.goldenSplash?1:0);
    if(this.fx.soaker>0)this.fxBadges.SOAKER.setText(`💦 ${this.fx.soaker.toFixed(1)}s`);if(this.fx.spinlock>0)this.fxBadges.SPINLOCK.setText(`🔒 ${this.fx.spinlock.toFixed(1)}s`);if(this.fx.doubleStars>0)this.fxBadges.DOUBLE_STARS.setText(`×2 ${this.fx.doubleStars.toFixed(1)}s`);
  }

  drawCrosshair(){
    const g=this.crosshairGfx;g.clear();
    const ox=this.gunX,oy=this.gunY,isFiring=this._fireToggle&&!this.isPumping&&this.waterTank>0;
    const dist=Phaser.Math.Distance.Between(ox,oy,this.aimX,this.aimY);
    const sc=this.fx.soaker>0?0x88DDFF:0x55CCFF;
    for(let i=1;i<16;i++){const t=i/16,px=ox+(this.aimX-ox)*t,py=oy+(this.aimY-oy)*t+dist*0.045*t*t,a=(isFiring?0.75:0.28)*(1-t*0.6);g.fillStyle(isFiring?sc:0x99CCFF,a);g.fillCircle(px,py,isFiring?2.8:1.8);}
    const x=this.aimX,y=this.aimY,r=this.aimSnapped?17:14,gap=5,len=10;
    const rc=this.fx.goldenSplash?0xFFDD00:this.aimSnapped?0x00EE66:0xFF88BB,ac=this.fx.goldenSplash?0xFFDD00:this.aimSnapped?0x00FF88:0xFF44AA;
    g.lineStyle(2.5,0x000000,0.5);g.strokeCircle(x,y,r+1);g.lineStyle(2,rc,0.9);g.strokeCircle(x,y,r);if(this.aimSnapped)g.lineStyle(1,rc,0.3),g.strokeCircle(x,y,r+6);
    g.lineStyle(2.5,0x000000,0.5);g.lineBetween(x-r-gap-len-1,y,x-gap-1,y);g.lineBetween(x+gap+1,y,x+r+gap+len+1,y);g.lineBetween(x,y-r-gap-len-1,x,y-gap-1);g.lineBetween(x,y+gap+1,x,y+r+gap+len+1);
    g.lineStyle(2,ac,1);g.lineBetween(x-r-gap-len,y,x-gap,y);g.lineBetween(x+gap,y,x+r+gap+len,y);g.lineBetween(x,y-r-gap-len,x,y-gap);g.lineBetween(x,y+gap,x,y+r+gap+len);g.fillStyle(ac,1);g.fillCircle(x,y,2.5);
  }

  drawP2Crosshair(){
    if(this.mode!==2)return;
    const g=this.p2CrosshairGfx;g.clear();
    const ax=this.p2AimXSnapped||this.p2AimX,ay=this.p2AimYSnapped||this.p2AimY;
    const ox=this.p2GunX,oy=this.p2GunY,isFiring=this.p2FireToggle&&!this.p2IsPumping&&this.p2WaterTank>0;
    const dist=Phaser.Math.Distance.Between(ox,oy,ax,ay);
    for(let i=1;i<16;i++){const t=i/16,px=ox+(ax-ox)*t,py=oy+(ay-oy)*t+dist*0.045*t*t,a=(isFiring?0.75:0.28)*(1-t*0.6);g.fillStyle(isFiring?0x55DDBB:0x99CCBB,a);g.fillCircle(px,py,isFiring?2.8:1.8);}
    const x=ax,y=ay,r=this.p2AimSnapped?17:14,gap=5,len=10;
    const rc=this.p2AimSnapped?0x00DDAA:0x88DDCC,ac=this.p2AimSnapped?0x00FFCC:0x44DDAA;
    g.lineStyle(2.5,0x000000,0.5);g.strokeCircle(x,y,r+1);g.lineStyle(2,rc,0.9);g.strokeCircle(x,y,r);if(this.p2AimSnapped)g.lineStyle(1,rc,0.3),g.strokeCircle(x,y,r+6);
    g.lineStyle(2.5,0x000000,0.5);g.lineBetween(x-r-gap-len-1,y,x-gap-1,y);g.lineBetween(x+gap+1,y,x+r+gap+len+1,y);g.lineBetween(x,y-r-gap-len-1,x,y-gap-1);g.lineBetween(x,y+gap+1,x,y+r+gap+len+1);
    g.lineStyle(2,ac,1);g.lineBetween(x-r-gap-len,y,x-gap,y);g.lineBetween(x+gap,y,x+r+gap+len,y);g.lineBetween(x,y-r-gap-len,x,y-gap);g.lineBetween(x,y+gap,x,y+r+gap+len);g.fillStyle(ac,1);g.fillCircle(x,y,2.5);
    // P2 label above crosshair
    // (redrawn text is expensive; only on position change — skip for perf)
  }
}

// ═══════════════════════════════════════════
new Phaser.Game({
  type:Phaser.AUTO,width:W,height:H,backgroundColor:'#06021A',
  scene:[WorldSelectScene,GameScene,GameOverScene],
  scale:{
    mode:Phaser.Scale.FIT,
    autoCenter:Phaser.Scale.CENTER_BOTH,
    parent:'game-container',
    width:W,height:H,
  },
  input:{activePointers:3},
  parent:'game-container',
  audio:{disableWebAudio:false},
});
</script>
</div><!-- /game-container -->
</body>
